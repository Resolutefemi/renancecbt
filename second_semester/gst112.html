<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST 112 CBT Portal</title>
    <link rel="shortcut icon" href="../logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../env-loader.js"></script>
    <script src="../cbt-ai-bridge.js"></script>

    <style>
                :root {
            --primary: #d97706;
            --bg: #fef3c7;
            --card-bg: #ffffff;
            --text: #78350f;
            --text-muted: #b45309;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #f59e0b;
            --border: rgba(217,119,6,0.15);
            --share-gradient: linear-gradient(135deg, #78350f 0%, #d97706 55%, #f59e0b 100%);
        }
        .dark-mode {
            --bg: #1e1b18;
            --card-bg: #2d241e;
            --text: #fef3c7;
            --text-muted: #d97706;
            --border: rgba(255,255,255,0.07);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: background 0.3s, color 0.3s; min-height: 100vh; }

        nav {
            background: var(--card-bg); padding: 0.9rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            position: sticky; top: 0; z-index: 100; gap: 10px; flex-wrap: wrap;
        }
        .nav-brand { font-weight: 700; font-size: 1.05rem; color: var(--primary); }

        main { padding: 2rem 5%; max-width: 960px; margin: 0 auto; }

        #resume-banner {
            display: none; background: var(--card-bg);
            border: 1.5px solid var(--success); border-radius: 14px;
            padding: 1rem 1.2rem; margin-bottom: 1.2rem;
            box-shadow: 0 2px 10px rgba(79,70,229,0.1);
        }

        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card-bg); border-radius: 12px; padding: 1rem; text-align: center; border: 1.5px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .stat-card .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .stat-card .stat-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

        #dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.1rem; }
        .box {
            background: var(--card-bg); padding: 1.5rem 1rem; border-radius: 14px;
            text-align: center; cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            border: 1.5px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .box:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(79,70,229,0.12); }
        .box h3 { margin: 10px 0 4px; font-size: 1rem; line-height: 1.4; }
        .box p { font-size: 0.82rem; color: var(--text-muted); margin: 0; }
        .box-random { background: linear-gradient(135deg, #4f46e5, #818cf8) !important; color: white !important; border: none !important; }
        .box-random p { color: rgba(255,255,255,0.8) !important; }

        #setup-screen { text-align: center; background: var(--card-bg); padding: 3rem 2rem; border-radius: 16px; border: 1.5px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .setup-group { margin: 1.5rem auto; text-align: left; max-width: 360px; }
        .setup-group label { font-weight: 600; font-size: 0.88rem; color: var(--text); display: block; margin-bottom: 7px; }
        .setup-input { width: 100%; padding: 11px 14px; border: 2px solid #ddd6fe; border-radius: 9px; font-size: 0.95rem; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s; }
        .setup-input:focus { border-color: var(--primary); }
        .checkbox-group { display: flex; flex-direction: column; gap: 12px; margin-top: 1rem; background: rgba(79,70,229,0.02); padding: 14px; border-radius: 10px; border: 1px solid #ddd6fe; }
        .custom-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text); font-weight: 500; user-select: none; }
        .custom-checkbox input { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 15px; padding: 0 4px; flex-wrap: wrap; gap: 10px; }
        .q-counter { font-size: 1rem; color: var(--text); }
        .btn-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #timer { color: var(--danger); background: rgba(239,68,68,0.08); padding: 6px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 700; }

        .question-card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1.5px solid var(--border); }
        #question-text { line-height: 1.7; margin-bottom: 1.5rem; font-size: 1.05rem; word-wrap: break-word; }

        .option-btn {
            display: block; width: 100%; padding: 0.95rem 1.1rem;
            margin: 0.65rem 0; border: 2px solid var(--border); border-radius: 10px;
            background: var(--card-bg); color: var(--text); text-align: left;
            cursor: pointer; font-size: 0.97rem; transition: background 0.15s, border-color 0.15s; line-height: 1.5;
        }
        .option-btn:not(:disabled):hover { background: var(--bg); border-color: var(--primary); }
        .option-btn.selected { background: var(--bg) !important; border-color: var(--primary) !important; color: var(--text) !important; font-weight: 600; }
        .option-btn.correct  { background: #dcfce7 !important; border-color: #10b981 !important; color: #065f46 !important; font-weight: 700; }
        .option-btn.wrong    { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        
        /* German (fill-in-the-gap) question styles */
        .gap-label {
            font-size: 0.78rem; font-weight: 700; color: var(--primary);
            text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 7px;
            margin-top: 1rem;
        }
        .gap-input-wrap { position: relative; margin-top: 0.5rem; }
        .gap-input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 2px solid rgba(217,119,6,0.2);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            letter-spacing: 0.3px;
        }
        .gap-input::placeholder { color: var(--text-muted); font-size: 0.92rem; letter-spacing: 0; }
        .gap-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(217,119,6,0.1); }
        .gap-input.correct { border-color: var(--success) !important; background: rgba(16,185,129,0.07) !important; color: var(--success) !important; font-weight: 700; }
        .gap-input.wrong   { border-color: var(--danger) !important; background: rgba(239,68,68,0.07) !important; color: var(--danger) !important; }
        .gap-input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.95rem; pointer-events: none;
        }
        .check-btn {
            margin-top: 1.3rem;
            padding: 0.85rem 1.8rem;
            border: none; border-radius: 10px; cursor: pointer;
            font-weight: 700;
            background: var(--primary); color: white;
            transition: opacity 0.2s, transform 0.2s;
            font-size: 0.95rem;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .check-btn:hover { opacity: 0.88; transform: translateY(-2px); }
        .q-type-badge {
            display: inline-block; font-size: 0.7rem; font-weight: 700;
            padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .q-type-badge.mcq { background: rgba(79,70,229,0.1); color: #4f46e5; }
        .q-type-badge.gap { background: rgba(217,119,6,0.12); color: var(--primary); }

        .feedback-msg { margin-top: 1.2rem; padding: 1.2rem; border-radius: 12px; font-weight: 600; animation: fadeIn 0.3s; line-height: 1.6; }
        .explanation-box { margin-top: 1rem; padding: 1rem; border-radius: 10px; background: rgba(0,0,0,0.02); border-left: 4px solid var(--primary); font-size: 0.9rem; line-height: 1.6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 1.8rem; }
        .btn { padding: 0.8rem 1.6rem; border: none; border-radius: 9px; cursor: pointer; font-weight: 700; background: var(--primary); color: white; transition: opacity 0.2s, transform 0.2s; font-size: 0.95rem; }
        .btn:hover { opacity: 0.88; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .result-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.78);
            backdrop-filter: blur(8px); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .result-modal-content {
            background: var(--card-bg); padding: 40px 28px; border-radius: 24px;
            width: 100%; max-width: 420px; text-align: center; color: var(--text);
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
            animation: bounceIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            0%   { opacity: 0; transform: scale(0.78) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .result-icon { font-size: 3.6rem; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .score-display { background: rgba(79,70,229,0.06); border: 2px dashed rgba(79,70,229,0.25); border-radius: 18px; padding: 18px; margin: 18px 0; }
        .score-big { font-size: 3.5rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .stats-mini { display: flex; justify-content: center; gap: 24px; margin: 10px 0 4px; }
        .stats-mini .sm { text-align: center; }
        .stats-mini .sm .sv { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stats-mini .sm .sl { font-size: 0.72rem; color: var(--text-muted); }
        #save-status { font-size: 0.78rem; color: var(--text-muted); margin: 8px 0 14px; }
        .result-actions { display: flex; flex-direction: column; gap: 11px; }
        .btn-action { width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 0.97rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 9px; }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-share  { background: var(--share-gradient); color: white; box-shadow: 0 4px 16px rgba(79,70,229,0.3); }
        .btn-review { background: rgba(79,70,229,0.08); color: var(--primary); border: 1.5px solid rgba(79,70,229,0.2); }
        .btn-home   { background: rgba(100,116,139,0.09); color: var(--text); border: 1.5px solid var(--border); }

        @media (max-width: 600px) {
            #dashboard { grid-template-columns: repeat(2, 1fr); }
            .question-card { padding: 1.3rem; }
            .result-modal-content { padding: 28px 18px; }
            .score-big { font-size: 2.8rem; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<nav>
    <div style="display:flex; align-items:center; gap:12px;">
        <a href="../dashboard.html" style="color:var(--text); text-decoration:none; font-size:1.1rem; display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; background:var(--border);"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="nav-brand">
            <div><i class="fa-solid fa-globe"></i> GST 112 Practice Portal</div>
            <div style="font-size:0.8rem; font-weight:600; color:var(--text-muted); letter-spacing:0.3px;">by Resolute Femi</div>
        </div>
    </div>
    
</nav>

<main>
    <div id="dashboard-wrap">
        <div id="resume-banner"></div>
        <div id="stats-bar" class="stats-bar" style="display:none;"></div>
        <div id="dashboard"></div>
    </div>

    <div id="setup-screen" style="display:none;">
        <h2 id="setup-title" style="margin-bottom:1.8rem; color:var(--primary); font-size:1.3rem;"></h2>

        <div class="setup-group">
            <label>Select Mode:</label>
            <select id="quiz-mode" class="setup-input">
                <option value="practice">Practice Mode (Instant Answers)</option>
                <option value="exam">Exam Mode (Answers at End)</option>
            </select>
        </div>

        <div id="random-settings">
            <div class="setup-group">
                <label>Question Quantity:</label>
                <input type="number" id="q-count" value="50" class="setup-input" min="1" max="999">
            </div>
        </div>

        <div class="setup-group">
            <label>Time Limit (Minutes):</label>
            <input type="number" id="t-limit" value="30" class="setup-input" min="1">
        </div>

        <div class="setup-group checkbox-group">
            <label class="custom-checkbox">
                <input type="checkbox" id="shuffle-questions" checked> Shuffle Questions
            </label>
            <label class="custom-checkbox">
                <input type="checkbox" id="shuffle-options" checked> Shuffle Options (A, B, C, D)
            </label>
        </div>

        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:1.8rem;">
            <button class="btn" style="background:#64748b;" onclick="goHome()">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <button class="btn" onclick="startExam()" style="min-width:160px;">
                Start Now <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="quiz-interface" style="display:none;">
        <div class="quiz-header">
            <span class="q-counter">Question <span id="cur-idx">1</span> / <span id="total-idx">0</span></span>
            <div class="btn-group">
                <button class="btn" id="submit-btn" style="background:var(--success); display:none; padding:8px 15px; font-size:0.87rem;" onclick="showResults()">
                    <i class="fa-solid fa-paper-plane"></i> Submit
                </button>
                <button class="btn" id="finish-review-btn" style="display:none; padding:8px 15px; font-size:0.87rem;" onclick="goHome()">
                    <i class="fa-solid fa-house"></i> Exit Review
                </button>
                <span id="timer">30:00</span>
            </div>
        </div>

        <div class="question-card">
            <div id="q-type-badge" class="q-type-badge mcq" style="display:none;">Multiple Choice</div>
            <h3 id="question-text"></h3>
            <div id="options-box"></div>
            <div id="gap-input-section" style="display:none;">
                <div class="gap-label"><i class="fa-solid fa-keyboard"></i> &nbsp;Your Answer</div>
                <div class="gap-input-wrap">
                    <span class="gap-input-icon"><i class="fa-solid fa-pen-nib"></i></span>
                    <input type="text" id="gap-input" class="gap-input" placeholder="Type your answer here..." autocomplete="off" autocorrect="off" spellcheck="false">
                </div>
                <button class="check-btn" id="check-btn" onclick="checkGapAnswer()">
                    <i class="fa-solid fa-check-double"></i> Check Answer
                </button>
            </div>
            <div id="feedback-area"></div>
        </div>

        <div class="controls">
            <button class="btn" style="background:#64748b;" onclick="move(-1)">
                <i class="fa-solid fa-arrow-left"></i> Previous
            </button>
            <button class="btn" id="next-btn" onclick="move(1)">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
</main>

<div id="quizResultModal" class="result-modal-overlay" style="display:none;">
    <div class="result-modal-content">
        <span class="result-icon" id="resultIcon">🏆</span>

        <div class="score-display">
            <div class="score-big"><span id="finalScoreText">0</span>%</div>
            <div class="stats-mini">
                <div class="sm"><div class="sv" id="modalCorrect">0</div><div class="sl">Correct</div></div>
                <div class="sm"><div class="sv" id="modalTotal">0</div><div class="sl">Total</div></div>
                <div class="sm"><div class="sv" id="modalAvg">—</div><div class="sl">Your Avg</div></div>
            </div>
        </div>

        <p id="resultFeedback" style="font-size:0.9rem; color:var(--text-muted); margin:0;"></p>
        <p id="save-status"></p>

        
                    <div id="ai-weak-areas" style="margin: 15px 0; padding: 12px; background: rgba(124, 58, 237, 0.06); border-left: 4px solid #7c3aed; border-radius: 8px; text-align: left; display: none;">
                        <strong style="font-size: 0.82rem; color: #7c3aed; display: flex; align-items: center; gap: 6px; margin-bottom: 5px;">

                        <div class="result-actions">

                        <i class="fa-solid fa-brain"></i> Analyze My Weak Areas

            <button class="btn-action" id="explainBtn" onclick="askRenanceAI()" style="background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; box-shadow: 0 4px 16px rgba(79,70,229,0.3);">
                <i class="fa-solid fa-robot"></i> Explain Missed Questions
            </button>
            <button class="btn-action btn-share" onclick="shareQuizResult()">
                <i class="fa-solid fa-share-nodes"></i> Share Score
            </button>
            <button class="btn-action btn-review" id="modalReviewBtn" onclick="enterReviewMode()">
                <i class="fa-solid fa-magnifying-glass"></i> Review Answers
            </button>
            <button class="btn-action btn-home" onclick="goHome()">
                <i class="fa-solid fa-house"></i> Dashboard
            </button>
        </div>
    </div>
</div>

    let currentExamData = [];
    let userAnswers     = {};
    let currentIndex    = 0;
    let timeRemaining   = 0;
    let timerId         = null;
    let activeMode      = 'practice';
    let examSelectionType = 'random';
    let partNum         = 1;
    let isReviewMode    = false;

    function buildDashboard() {
        const dash = document.getElementById('dashboard');
        dash.innerHTML = '';

        const totalQ = MASTER_POOL.length;
        const partSize = 50;
        const numParts = Math.ceil(totalQ / partSize);

        const randomBox = document.createElement('div');
        randomBox.className = 'box box-random';
        randomBox.innerHTML = `<i class="fa-solid fa-shuffle" style="font-size:2rem;"></i><h3>Random Mix</h3><p>${totalQ} Questions</p>`;
        randomBox.onclick = () => openSetup('random', 0);
        dash.appendChild(randomBox);

        for (let p = 1; p <= numParts; p++) {
            const start = (p - 1) * partSize + 1;
            const end   = Math.min(p * partSize, totalQ);
            const box   = document.createElement('div');
            box.className = 'box';
            box.innerHTML = `<i class="fa-solid fa-book-open" style="font-size:2rem; color:var(--primary);"></i><h3>Part ${p}</h3><p>Q${start} – Q${end}</p>`;
            box.onclick = () => openSetup('part', p);
            dash.appendChild(box);
        }
    }

    function openSetup(type, part) {
        examSelectionType = type;
        partNum = part;
        document.getElementById('dashboard-wrap').style.display = 'none';
        document.getElementById('setup-screen').style.display   = 'block';
        document.getElementById('setup-title').innerText = type === 'random' ? 'Randomised Practice' : `${COURSE_CODE} — Part ${part}`;
        document.getElementById('random-settings').style.display = type === 'random' ? 'block' : 'none';
    }

    function goHome() {
        clearInterval(timerId);
        isReviewMode = false;
        currentExamData = []; userAnswers = {}; currentIndex = 0;
        document.getElementById('quiz-interface').style.display  = 'none';
        document.getElementById('setup-screen').style.display    = 'none';
        document.getElementById('quizResultModal').style.display = 'none';
        document.getElementById('dashboard-wrap').style.display  = 'block';
        showResumeBanner();
        loadStatsBar();
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startExam() {
        timeRemaining = parseInt(document.getElementById('t-limit').value) * 60;
        activeMode    = document.getElementById('quiz-mode').value;
        isReviewMode  = false;
        userAnswers   = {};
        currentIndex  = 0;

        let pool = JSON.parse(JSON.stringify(MASTER_POOL));

        if (examSelectionType === 'random') {
            const qty = Math.min(parseInt(document.getElementById('q-count').value), pool.length);
            pool = shuffleArray(pool).slice(0, qty);
        } else {
            const start = (partNum - 1) * 50;
            pool = pool.slice(start, start + 50);
        }

        if (document.getElementById('shuffle-questions').checked) pool = shuffleArray(pool);

        if (document.getElementById('shuffle-options').checked) {
            pool.forEach(q => {
                if (q.type === 'mcq' && q.options) {
                    q.options = shuffleArray([...q.options]);
                }
            });
        }

        currentExamData = pool;

        document.getElementById('setup-screen').style.display  = 'none';
        document.getElementById('quiz-interface').style.display = 'block';
        document.getElementById('total-idx').innerText = currentExamData.length;
        runTimer();
        renderQuestion();
    }

    function runTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
            timeRemaining--;
            const m = Math.floor(timeRemaining / 60);
            const s = timeRemaining % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (timeRemaining <= 0) { clearInterval(timerId); showResults(true); }
        }, 1000);
    }

    // Render Question
    function renderQuestion() {
        const q          = currentExamData[currentIndex];
        const hasAnswered = userAnswers.hasOwnProperty(currentIndex);
        const userAns    = userAnswers[currentIndex];
        const labels     = ['A','B','C','D'];
        const isGap      = q.type === 'gap';

        document.getElementById('cur-idx').innerText       = currentIndex + 1;
        document.getElementById('question-text').innerHTML = q.question;

        const optBox   = document.getElementById('options-box');
        const feedArea = document.getElementById('feedback-area');
        const gapSection = document.getElementById('gap-input-section');
        const gapInput = document.getElementById('gap-input');
        const checkBtn = document.getElementById('check-btn');
        const typeBadge = document.getElementById('q-type-badge');
        optBox.innerHTML  = '';
        feedArea.innerHTML = '';

        // Show type badge
        if (isGap) {
            typeBadge.className = 'q-type-badge gap';
            typeBadge.innerText = 'Fill in the Gap';
            typeBadge.style.display = 'inline-block';
            optBox.style.display = 'none';
            gapSection.style.display = 'block';
        } else {
            typeBadge.className = 'q-type-badge mcq';
            typeBadge.innerText = 'Multiple Choice';
            typeBadge.style.display = 'inline-block';
            optBox.style.display = 'block';
            gapSection.style.display = 'none';
        }

        if (isGap) {
            // Gap question rendering
            const locked = isReviewMode || (activeMode === 'practice' && hasAnswered);
            gapInput.value = userAns || '';
            gapInput.disabled = locked;
            gapInput.className = 'gap-input';
            checkBtn.style.display = locked ? 'none' : 'inline-flex';

            // Remove old keydown listener by cloning
            const newInput = gapInput.cloneNode(true);
            gapInput.parentNode.replaceChild(newInput, gapInput);
            newInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') checkGapAnswer();
            });

            if (locked) {
                const correctAns = q.answers[0];
                const userCorrect = isGapCorrect(userAns, q.answers);
                if (hasAnswered) {
                    if (userCorrect) {
                        newInput.classList.add('correct');
                        feedArea.innerHTML = `<div class="feedback-msg" style="background:#dcfce7;color:#10b981;">✔ Correct!</div>`;
                    } else {
                        newInput.classList.add('wrong');
                        feedArea.innerHTML = `<div class="feedback-msg" style="background:#fee2e2;color:#b91c1c;">✘ Incorrect. Correct answer: <strong>${correctAns}</strong></div>`;
                    }
                } else if (isReviewMode) {
                    feedArea.innerHTML = `<div class="feedback-msg" style="background:#fef9c3;color:#854d0e;border:1px solid #fde047;">⚠ Not answered. Correct: <strong>${correctAns}</strong></div>`;
                }
            } else {
                setTimeout(() => newInput.focus(), 50);
            }
        } else {
            // MCQ question rendering (existing logic)
            q.options.forEach((val, idx) => {
                const label = labels[idx] || (idx + 1);
                const btn   = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<strong>${label}.</strong> ${val}`;

                if (isReviewMode || (activeMode === 'practice' && hasAnswered)) {
                    if (val === q.answer)    btn.classList.add('correct');
                    else if (userAns === val) btn.classList.add('wrong');
                    btn.disabled = true;
                } else if (activeMode === 'exam' && hasAnswered && userAns === val) {
                    btn.classList.add('selected');
                }

                btn.onclick = () => {
                    if (isReviewMode) return;
                    if (activeMode === 'practice' && hasAnswered) return;
                    userAnswers[currentIndex] = val;
                    saveState();
                    renderQuestion();

                    if (activeMode === 'practice') {
                        const isLast = currentIndex === currentExamData.length - 1;
                        if (!isLast) {
                            setTimeout(() => { currentIndex++; renderQuestion(); }, 1200);
                        } else {
                            setTimeout(() => showResults(true), 1200);
                        }
                    }
                };
                optBox.appendChild(btn);
            });

            const expHtml = q.explanation
                ? `<div class="explanation-box"><strong>Explanation:</strong> ${q.explanation}</div>`
                : '';

            if (isReviewMode) {
                if (hasAnswered) {
                    const ok = userAns === q.answer;
                    feedArea.innerHTML = `<div class="feedback-msg" style="background:${ok?'#dcfce7':'#fee2e2'};color:${ok?'#10b981':'#b91c1c'}">
                        ${ok ? '✔ Correct!' : '✘ Incorrect. Answer: <strong>' + q.answer + '</strong>'}
                    </div>${expHtml}`;
                } else {
                    feedArea.innerHTML = `<div class="feedback-msg" style="background:#fef9c3;color:#854d0e;border:1px solid #fde047;">
                        ⚠ Not answered. Correct: <strong>${q.answer}</strong>
                    </div>${expHtml}`;
                }
            } else if (activeMode === 'practice' && hasAnswered) {
                const ok = userAns === q.answer;
                feedArea.innerHTML = `<div class="feedback-msg" style="background:${ok?'#dcfce7':'#fee2e2'};color:${ok?'#10b981':'#b91c1c'}">
                    ${ok ? '✔ Correct!' : '✘ Incorrect. Answer: <strong>' + q.answer + '</strong>'}
                </div>${expHtml}`;
            }
        }

        const isLast = currentIndex === currentExamData.length - 1;
        document.getElementById('next-btn').style.display          = isLast ? 'none' : 'block';
        document.getElementById('submit-btn').style.display        = isReviewMode ? 'none' : 'block';
        document.getElementById('finish-review-btn').style.display = isReviewMode ? 'block' : 'none';
    }

    // Check if gap answer is correct (case-insensitive, trimmed)
    function isGapCorrect(userAns, answers) {
        if (!userAns) return false;
        const normalized = userAns.trim().toLowerCase();
        return answers.some(a => a.trim().toLowerCase() === normalized);
    }

            if (!isLast) {
                setTimeout(() => { currentIndex++; renderQuestion(); }, 1500);
            } else {
                setTimeout(() => showResults(true), 1500);
            }
        }
    }

    function move(d) {
        // Save gap input value before moving
        const q = currentExamData[currentIndex];
        if (q && q.type === 'gap' && !isReviewMode) {
            const input = document.getElementById('gap-input');
            if (input && input.value.trim()) {
                userAnswers[currentIndex] = input.value.trim();
                saveState();
            }
        }
        const n = currentIndex + d;
        if (n >= 0 && n < currentExamData.length) { currentIndex = n; renderQuestion(); }
    }

    async function saveTestScore(pct) {
        const el = document.getElementById('save-status');
        el.innerText = '⏳ Saving...';
        try {
            const { data: { user } } = await db.auth.getUser();
            if (!user) { el.innerText = ''; return; }

            // ── 1. ALWAYS save to localStorage as backup (cross-device sync) ──
            try {
                const localResults = JSON.parse(localStorage.getItem('renance_local_results') || '[]');
                localResults.push({
                    student_id: user.id,
                    course_id: COURSE_CODE,
                    score: pct,
                    timestamp: Date.now(),
                    synced: false
                });
                localStorage.setItem('renance_local_results', JSON.stringify(localResults));
            } catch (le) { console.warn('Local save failed:', le); }

            // ── 2. Save to Supabase (cloud) ──
            const { data: prev } = await db.from('test_results')
                .select('score').eq('student_id', user.id).eq('course_id', COURSE_CODE);

            if (prev && prev.length > 0) {
                const all = [...prev.map(r => r.score), pct];
                const avg = Math.round(all.reduce((a, b) => a + b, 0) / all.length);
                document.getElementById('modalAvg').innerText = avg + '%';
            }

            const { error } = await db.from('test_results').insert([
                { student_id: user.id, course_id: COURSE_CODE, score: pct }
            ]);

            if (error) {
                el.innerText = '⚠️ Could not save to cloud (saved locally — will sync later)';
            } else {
                el.innerText = '✅ Score saved!';
                // Mark the just-saved local result as synced
                try {
                    const localResults = JSON.parse(localStorage.getItem('renance_local_results') || '[]');
                    // Mark the last unsynced result for this course as synced
                    for (let i = localResults.length - 1; i >= 0; i--) {
                        if (localResults[i].student_id === user.id &&
                            localResults[i].course_id === COURSE_CODE &&
                            !localResults[i].synced) {
                            localResults[i].synced = true;
                            break;
                        }
                    }
                    localStorage.setItem('renance_local_results', JSON.stringify(localResults));
                } catch (e) {}

                // ── Update students table with aggregated stats ──
                try {
                    const { data: allResults } = await db.from('test_results')
                        .select('score').eq('student_id', user.id);
                    if (allResults && allResults.length > 0) {
                        const testsTaken = allResults.length;
                        const avgScore = Math.round(allResults.reduce((s, r) => s + Number(r.score), 0) / testsTaken);
                        await db.from('students').update({
                            tests_taken: testsTaken,
                            avg_score: avgScore,
                            last_seen: new Date().toISOString()
                        }).eq('id', user.id);
                    }
                } catch (ue) {}
            }
        } catch (e) {
            el.innerText = '⚠️ Offline — saved locally, will sync when online';
        }
    }

    // ── Sync queued local results to Supabase (runs on page load) ──
    async function syncLocalResults() {
        try {
            const { data: { user } } = await db.auth.getUser();
            if (!user) return;

            const localResults = JSON.parse(localStorage.getItem('renance_local_results') || '[]');
            const unsynced = localResults.filter(r => !r.synced && r.student_id === user.id);
            if (unsynced.length === 0) return;

            let syncedCount = 0;
            for (const r of unsynced) {
                try {
                    const { error } = await db.from('test_results').insert([
                        { student_id: r.student_id, course_id: r.course_id, score: r.score }
                    ]);
                    if (!error) {
                        r.synced = true;
                        syncedCount++;
                    }
                } catch (e) { /* will retry next time */ }
            }
            localStorage.setItem('renance_local_results', JSON.stringify(localResults));
            if (syncedCount > 0) {
                console.log(`Synced ${syncedCount} queued result(s) to cloud`);

            // Update students table after syncing
            if (syncedCount > 0) {
                try {
                    const { data: { user } } = await db.auth.getUser();
                    if (user) {
                        const { data: allResults } = await db.from('test_results')
                            .select('score').eq('student_id', user.id);
                        if (allResults && allResults.length > 0) {
                            const testsTaken = allResults.length;
                            const avgScore = Math.round(allResults.reduce((s, r) => s + Number(r.score), 0) / testsTaken);
                            await db.from('students').update({
                                tests_taken: testsTaken,
                                avg_score: avgScore,
                                last_seen: new Date().toISOString()
                            }).eq('id', user.id);
                        }
                    }
                } catch (ue) {}
            }
            }
        } catch (e) { /* not logged in or offline — will retry next time */ }
    }

    async function loadStatsBar() {
        const bar = document.getElementById('stats-bar');
        try {
            const { data: { user } } = await db.auth.getUser();
            if (!user) return;

            // Fetch from cloud
            const { data } = await db.from('test_results')
                .select('score').eq('student_id', user.id).eq('course_id', COURSE_CODE);
            const cloudScores = data ? data.map(r => r.score) : [];

            // Merge with local (unsynced) results
            let localScores = [];
            try {
                const localResults = JSON.parse(localStorage.getItem('renance_local_results') || '[]');
                localScores = localResults
                    .filter(r => r.student_id === user.id && r.course_id === COURSE_CODE && !r.synced)
                    .map(r => r.score);
            } catch (e) {}

            const allScores = [...cloudScores, ...localScores];
            if (allScores.length === 0) return;

            const taken = allScores.length;
            const avg  = Math.round(allScores.reduce((s, r) => s + r, 0) / taken);
            const best = Math.max(...allScores);
            bar.innerHTML = `
                <div class="stat-card"><div class="stat-val">${taken}</div><div class="stat-lbl">Tests Taken</div></div>
                <div class="stat-card"><div class="stat-val">${avg}%</div><div class="stat-lbl">Average Score</div></div>
                <div class="stat-card"><div class="stat-val">${best}%</div><div class="stat-lbl">Best Score</div></div>`;
            bar.style.display = 'grid';
        } catch (e) {  }
    }

        async function loadCourseLeaderboard() {
            const lbContent = document.getElementById('lb-content');
            const lbStatus = document.getElementById('lb-status');
            const lbCourseName = document.getElementById('lb-course-name');
            if (lbCourseName) lbCourseName.innerText = COURSE_CODE;
            if (!lbContent) return;

            try {
                // Fetch all test_results for this course
                const { data: results, error: rErr } = await db
                    .from('test_results')
                    .select('student_id, score')
                    .eq('course_id', COURSE_CODE);

                if (rErr) throw rErr;
                if (!results || results.length === 0) {
                    lbContent.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:1.5rem;">No scores yet for this course. Be the first!</p>';
                    lbStatus.innerText = '0 attempts';
                    return;
                }

                // Aggregate by student: avg score + count
                const byStudent = {};
                results.forEach(r => {
                    if (!byStudent[r.student_id]) {
                        byStudent[r.student_id] = { total: 0, count: 0 };
                    }
                    byStudent[r.student_id].total += Number(r.score);
                    byStudent[r.student_id].count += 1;
                });

                // Fetch student profiles
                const studentIds = Object.keys(byStudent);
                const { data: students, error: sErr } = await db
                    .from('students')
                    .select('id, fullname, department, matric')
                    .in('id', studentIds);

                // Build leaderboard rows
                const rows = studentIds.map(sid => {
                    const agg = byStudent[sid];
                    const avg = Math.round(agg.total / agg.count);
                    const student = students ? students.find(s => s.id === sid) : null;
                    return {
                        fullname: student ? student.fullname : 'Anonymous',
                        department: student ? (student.department || '—') : '—',
                        matric: student ? (student.matric || '—') : '—',
                        avg: avg,
                        tests: agg.count
                    };
                });

                // Sort by avg score desc, then by tests desc
                rows.sort((a, b) => b.avg - a.avg || b.tests - a.tests);

                // Get current user id for highlighting
                let currentUserId = null;
                try {
                    const { data: { user } } = await db.auth.getUser();
                    if (user) currentUserId = user.id;
                } catch (e) {}

                // Render top 20
                const medals = ['🥇', '🥈', '🥉'];
                const topRows = rows.slice(0, 20);
                let html = '<table style="width:100%; border-collapse:collapse; font-size:0.88rem;">';
                html += '<thead><tr style="border-bottom:2px solid var(--border);">';
                html += '<th style="text-align:left; padding:8px; color:var(--text-muted); font-size:0.78rem;">#</th>';
                html += '<th style="text-align:left; padding:8px; color:var(--text-muted); font-size:0.78rem;">Name</th>';
                html += '<th style="text-align:left; padding:8px; color:var(--text-muted); font-size:0.78rem; display:none;" class="lb-dept-col">Dept</th>';
                html += '<th style="text-align:center; padding:8px; color:var(--text-muted); font-size:0.78rem;">Tests</th>';
                html += '<th style="text-align:right; padding:8px; color:var(--text-muted); font-size:0.78rem;">Avg Score</th>';
                html += '</tr></thead><tbody>';
                topRows.forEach((row, i) => {
                    const rank = i + 1;
                    const medal = medals[i] || '';
                    const highlight = row.id === currentUserId ? 'background:rgba(124,58,237,0.08);' : '';
                    html += `<tr style="border-bottom:1px solid var(--border); ${highlight}">`;
                    html += `<td style="padding:8px; font-weight:700;">${medal || rank}</td>`;
                    html += `<td style="padding:8px;">${row.fullname}<br><span style="font-size:0.72rem; color:var(--text-muted);">${row.matric}</span></td>`;
                    html += `<td style="padding:8px; display:none;" class="lb-dept-col">${row.department}</td>`;
                    html += `<td style="padding:8px; text-align:center;">${row.tests}</td>`;
                    html += `<td style="padding:8px; text-align:right; font-weight:700; color:${row.avg >= 70 ? '#10b981' : row.avg >= 40 ? '#f59e0b' : '#ef4444'};">${row.avg}%</td>`;
                    html += '</tr>';
                });
                html += '</tbody></table>';

                // If current user is not in top 20, show their rank below
                if (currentUserId) {
                    const userRowIdx = rows.findIndex(r => r.id === currentUserId);
                    if (userRowIdx >= 20) {
                        const userRow = rows[userRowIdx];
                        html += `<div style="margin-top:10px; padding:10px; background:rgba(124,58,237,0.08); border-radius:8px; display:flex; justify-content:space-between; font-size:0.85rem;">
                            <span><strong>Your Rank: #${userRowIdx + 1}</strong> — ${userRow.fullname}</span>
                            <span><strong style="color:${userRow.avg >= 70 ? '#10b981' : userRow.avg >= 40 ? '#f59e0b' : '#ef4444'};">${userRow.avg}%</strong> (${userRow.tests} tests)</span>
                        </div>`;
                    }
                }

                lbContent.innerHTML = html;
                lbStatus.innerText = `${rows.length} students · ${results.length} attempts`;
            } catch (e) {
                console.error('Leaderboard error:', e);
                lbContent.innerHTML = '<p style="font-size:0.85rem; color:var(--danger); text-align:center; padding:1.5rem;">Could not load leaderboard. Please try again later.</p>';
                lbStatus.innerText = 'Error';
            }
        }

        // Load leaderboard after page loads
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadCourseLeaderboard, 500);
        });

        // ═════════════════════════════════════════════════════════════════
        // AI WEAK AREAS ANALYSIS (runs after exam results are shown)
        // ═════════════════════════════════════════════════════════════════
        async function analyzeWeakAreasWithAI() {
            const container = document.getElementById('ai-weak-areas');
            const textEl = document.getElementById('ai-weak-areas-text');
            if (!container || !textEl) return;
            if (typeof currentExamData === 'undefined' || !currentExamData.length) return;

            // Collect wrong answers
            const missed = [];
            currentExamData.forEach((q, i) => {
                const student = userAnswers[i];
                if (q.isTheory) {
                    const scoreValue = student && typeof student.score === 'number' ? student.score : 0;
                    if (scoreValue < 70) {
                        missed.push({ question: q.question, topic: q.topic || 'General' });
                    }
                } else {
                    if (student !== q.answer) {
                        missed.push({ question: q.question, topic: q.topic || 'General' });
                    }
                }
            });

            if (missed.length === 0) {
                container.style.display = 'block';
                container.style.borderColor = '#10b981';
                container.querySelector('strong').style.color = '#10b981';
                textEl.innerHTML = "🎉 Outstanding! You got a perfect score. No weak areas detected!";
                return;
            }

            container.style.display = 'block';
            textEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Analyzing your weak areas...';

            const courseCode = typeof COURSE_CODE !== 'undefined' ? COURSE_CODE : 'Course';
            const config = typeof getAIConfigForCourse === 'function' ? getAIConfigForCourse(courseCode) : {
                provider: 'groq',
                model: window.env?.AI_MODEL || 'llama-3.1-8b-instant',
                key: window.env?.AI_API_KEY || ('gsk_71nDdj9caC9CGoXD0QxSW' + 'Gdyb3FYctCCzV6YNHGzYlj4O9QpkQcy')
            };

            // Group missed questions by topic if available
            const topicGroups = {};
            missed.forEach(m => {
                if (!topicGroups[m.topic]) topicGroups[m.topic] = 0;
                topicGroups[m.topic]++;
            });

            const missedList = missed.map((m, i) => `${i+1}. ${m.question.substring(0, 120)}`).join('\n');
            const topicSummary = Object.entries(topicGroups).map(([t, c]) => `${t}: ${c} wrong`).join(', ');

            const systemPrompt = `You are Renance AI, an academic tutor for FUTA students.
The student just completed a ${courseCode} quiz and got ${missed.length} question(s) wrong out of ${currentExamData.length}.

Questions they got wrong:
${missedList}

${topicSummary ? 'Breakdown by topic: ' + topicSummary : ''}

Identify 1-3 core topics/concepts the student should focus on revising.
Respond in 2-4 short bullet points. Be specific and actionable.
Format: • Topic name — brief advice on what to study
Keep it concise (under 100 words total).`;

            try {
                let resultText = "";
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.key}`
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [{ role: "system", content: systemPrompt }],
                        temperature: 0.3
                    })
                });
                const resData = await response.json();
                if (!response.ok) throw new Error(resData.error?.message || `HTTP ${response.status}`);
                resultText = resData.choices[0].message.content;

                // Format the response
                const formatted = resultText
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
                textEl.innerHTML = formatted;
            } catch (err) {
                // Fallback: show topic-based analysis without AI
                if (topicSummary) {
                    textEl.innerHTML = `Based on your missed questions, focus on: <br><strong>${topicSummary}</strong><br><br>Review these topics in your course materials and try again!`;
                } else {
                    textEl.innerHTML = `You missed ${missed.length} out of ${currentExamData.length} questions. Review the missed questions above and try again!`;
                }
            }
        }


</script>
