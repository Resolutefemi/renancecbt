<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS 104 CBT Portal</title>
    <link rel="shortcut icon" href="../logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../env-loader.js"></script>
    <script src="../cbt-ai-bridge.js"></script>

    <style>
        :root {
            --primary: #ea580c;
            --bg: #fff7ed;
            --card-bg: #ffffff;
            --text: #7c2d12;
            --text-muted: #f97316;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #f59e0b;
            --border: rgba(234,88,12,0.15);
            --share-gradient: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #fdba74 100%);
        }
        .dark-mode {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255,255,255,0.07);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: background 0.3s, color 0.3s; min-height: 100vh; }

        nav {
            background: var(--card-bg); padding: 0.9rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            position: sticky; top: 0; z-index: 100; gap: 10px; flex-wrap: wrap;
        }
        .nav-brand { font-weight: 700; font-size: 1.05rem; color: var(--primary); }

        main { padding: 2rem 5%; max-width: 960px; margin: 0 auto; }

        #resume-banner {
            display: none; background: var(--card-bg);
            border: 1.5px solid var(--success); border-radius: 14px;
            padding: 1rem 1.2rem; margin-bottom: 1.2rem;
            box-shadow: 0 2px 10px rgba(29,78,216,0.1);
        }

        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card-bg); border-radius: 12px; padding: 1rem; text-align: center; border: 1.5px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .stat-card .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .stat-card .stat-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

        #dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.1rem; }
        .box {
            background: var(--card-bg); padding: 1.5rem 1rem; border-radius: 14px;
            text-align: center; cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            border: 1.5px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .box:hover { transform: translate Y(-5px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(29,78,216,0.12); }
        .box h3 { margin: 10px 0 4px; font-size: 1rem; line-height: 1.4; }
        .box p { font-size: 0.82rem; color: var(--text-muted); margin: 0; }
        .box-random { background: linear-gradient(135deg, #1d4ed8, #60a5fa) !important; color: white !important; border: none !important; }
        .box-random p { color: rgba(255,255,255,0.8) !important; }

        #setup-screen { text-align: center; background: var(--card-bg); padding: 3rem 2rem; border-radius: 16px; border: 1.5px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .setup-group { margin: 1.5rem auto; text-align: left; max-width: 360px; }
        .setup-group label { font-weight: 600; font-size: 0.88rem; color: var(--text); display: block; margin-bottom: 7px; }
        .setup-input { width: 100%; padding: 11px 14px; border: 2px solid #bfdbfe; border-radius: 9px; font-size: 0.95rem; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s; }
        .setup-input:focus { border-color: var(--primary); }
        .checkbox-group { display: flex; flex-direction: column; gap: 12px; margin-top: 1rem; background: rgba(29,78,216,0.02); padding: 14px; border-radius: 10px; border: 1px solid #bfdbfe; }
        .custom-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text); font-weight: 500; user-select: none; }
        .custom-checkbox input { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 15px; padding: 0 4px; flex-wrap: wrap; gap: 10px; }
        .q-counter { font-size: 1rem; color: var(--text); }
        .btn-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #timer { color: var(--danger); background: rgba(239,68,68,0.08); padding: 6px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 700; }

        .question-card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1.5px solid var(--border); }
        #question-text { line-height: 1.7; margin-bottom: 1.5rem; font-size: 1.05rem; word-wrap: break-word; }

        .option-btn {
            display: block; width: 100%; padding: 0.95rem 1.1rem;
            margin: 0.65rem 0; border: 2px solid var(--border); border-radius: 10px;
            background: var(--card-bg); color: var(--text); text-align: left;
            cursor: pointer; font-size: 0.97rem; transition: background 0.15s, border-color 0.15s; line-height: 1.5;
        }
        .option-btn:not(:disabled):hover { background: var(--bg); border-color: var(--primary); }
        .option-btn.selected { background: var(--bg) !important; border-color: var(--primary) !important; color: var(--text) !important; font-weight: 600; }
        .option-btn.correct  { background: #dcfce7 !important; border-color: #10b981 !important; color: #065f46 !important; font-weight: 700; }
        .option-btn.wrong    { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        .feedback-msg { margin-top: 1.2rem; padding: 1.2rem; border-radius: 12px; font-weight: 600; animation: fade In 0.3s; line-height: 1.6; }
        .explanation-box { margin-top: 1rem; padding: 1rem; border-radius: 10px; background: rgba(0,0,0,0.02); border-left: 4px solid var(--primary); font-size: 0.9rem; line-height: 1.6; }
        @keyframes fade In { from { opacity: 0; transform: translate Y(8px); } to { opacity: 1; transform: translate Y(0); } }

        .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 1.8rem; }
        .btn { padding: 0.8rem 1.6rem; border: none; border-radius: 9px; cursor: pointer; font-weight: 700; background: var(--primary); color: white; transition: opacity 0.2s, transform 0.2s; font-size: 0.95rem; }
        .btn:hover { opacity: 0.88; transform: translate Y(-2px); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .result-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.78);
            backdrop-filter: blur(8px); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .result-modal-content {
            background: var(--card-bg); padding: 40px 28px; border-radius: 24px;
            width: 100%; max-width: 420px; text-align: center; color: var(--text);
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
            animation: bounce In 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounce In {
            0%   { opacity: 0; transform: scale(0.78) translate Y(30px); }
            100% { opacity: 1; transform: scale(1) translate Y(0); }
        }
        .result-icon { font-size: 3.6rem; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translate Y(0); } 50% { transform: translate Y(-10px); } }
        .score-display { background: rgba(29,78,216,0.06); border: 2px dashed rgba(29,78,216,0.25); border-radius: 18px; padding: 18px; margin: 18px 0; }
        .score-big { font-size: 3.5rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .stats-mini { display: flex; justify-content: center; gap: 24px; margin: 10px 0 4px; }
        .stats-mini .sm { text-align: center; }
        .stats-mini .sm .sv { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stats-mini .sm .sl { font-size: 0.72rem; color: var(--text-muted); }
        #save-status { font-size: 0.78rem; color: var(--text-muted); margin: 8px 0 14px; }
        .result-actions { display: flex; flex-direction: column; gap: 11px; }
        .btn-action { width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 0.97rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 9px; }
        .btn-action:hover { opacity: 0.9; transform: translate Y(-1px); }
        .btn-share  { background: var(--share-gradient); color: white; box-shadow: 0 4px 16px rgba(29,78,216,0.3); }
        .btn-review { background: rgba(29,78,216,0.08); color: var(--primary); border: 1.5px solid rgba(29,78,216,0.2); }
        .btn-home   { background: rgba(100,116,139,0.09); color: var(--text); border: 1.5px solid var(--border); }

        @media (max-width: 600px) {
            #dashboard { grid-template-columns: repeat(2, 1fr); }
            .question-card { padding: 1.3rem; }
            .result-modal-content { padding: 28px 18px; }
            .score-big { font-size: 2.8rem; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<nav>
    <div style="display:flex; align-items:center; gap:12px;">
        <a href="../dashboard.html" style="color:var(--text); text-decoration:none; font-size:1.1rem; display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; background:var(--border);"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="nav-brand">
            <div><i class="fa-solid fa-briefcase"></i> AMS 104 Practice Portal</div>
            <div style="font-size:0.8rem; font-weight:600; color:var(--text-muted); letter-spacing:0.3px;">by Resolute Femi</div>
        </div>
    </div>
    
</nav>

<main>
    <div id="dashboard-wrap">
        <div id="resume-banner"></div>
        <div id="stats-bar" class="stats-bar" style="display:none;"></div>
        <div id="dashboard"></div>
    </div>

    <div id="setup-screen" style="display:none;">
        <h2 id="setup-title" style="margin-bottom:1.8rem; color:var(--primary); font-size:1.3rem;"></h2>

        <div class="setup-group">
            <label>Select Mode:</label>
            <select id="quiz-mode" class="setup-input">
                <option value="practice">Practice Mode (Instant Answers)</option>
                <option value="exam">Exam Mode (Answers at End)</option>
            </select>
        </div>

        <div id="random-settings">
            <div class="setup-group">
                <label>Question Quantity:</label>
                <input type="number" id="q-count" value="50" class="setup-input" min="1" max="999">
            </div>
        </div>

        <div class="setup-group">
            <label>Time Limit (Minutes):</label>
            <input type="number" id="t-limit" value="30" class="setup-input" min="1">
        </div>

        <div class="setup-group checkbox-group">
            <label class="custom-checkbox">
                <input type="checkbox" id="shuffle-questions" checked> Shuffle Questions
            </label>
            <label class="custom-checkbox">
                <input type="checkbox" id="shuffle-options" checked> Shuffle Options (A, B, C, D)
            </label>
        </div>

        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:1.8rem;">
            <button class="btn" style="background:#64748b;" onclick="go Home()">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <button class="btn" onclick="start Exam()" style="min-width:160px;">
                Start Now <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="quiz-interface" style="display:none;">
        <div class="quiz-header">
            <span class="q-counter">Question <span id="cur-idx">1</span> / <span id="total-idx">0</span></span>
            <div class="btn-group">
                <button class="btn" id="submit-btn" style="background:var(--success); display:none; padding:8px 15px; font-size:0.87rem;" onclick="show Results()">
                    <i class="fa-solid fa-paper-plane"></i> Submit
                </button>
                <button class="btn" id="finish-review-btn" style="display:none; padding:8px 15px; font-size:0.87rem;" onclick="go Home()">
                    <i class="fa-solid fa-house"></i> Exit Review
                </button>
                <span id="timer">30:00</span>
            </div>
        </div>

        <div class="question-card">
            <h3 id="question-text"></h3>
            <div id="options-box"></div>
            <div id="feedback-area"></div>
        </div>

        <div class="controls">
            <button class="btn" style="background:#64748b;" onclick="move(-1)">
                <i class="fa-solid fa-arrow-left"></i> Previous
            </button>
            <button class="btn" id="next-btn" onclick="move(1)">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
</main>

<div id="quiz Result Modal" class="result-modal-overlay" style="display:none;">
    <div class="result-modal-content">
        <span class="result-icon" id="result Icon">🏆</span>
        <h2 id="result Greeting" style="margin:0 0 14px; font-size:1.5rem;">Outstanding!</h2>

        <div class="score-display">
            <div class="score-big"><span id="final Score Text">0</span>%</div>
            <div class="stats-mini">
                <div class="sm"><div class="sv" id="modal Correct">0</div><div class="sl">Correct</div></div>
                <div class="sm"><div class="sv" id="modal Total">0</div><div class="sl">Total</div></div>
                <div class="sm"><div class="sv" id="modal Avg">—</div><div class="sl">Your Avg</div></div>
            </div>
        </div>

        <p id="result Feedback" style="font-size:0.9rem; color:var(--text-muted); margin:0;"></p>
        <p id="save-status"></p>

        
                    <div id="ai-weak-areas" style="margin: 15px 0; padding: 12px; background: rgba(124, 58, 237, 0.06); border-left: 4px solid #7c3aed; border-radius: 8px; text-align: left; display: none;">
                        <strong style="font-size: 0.82rem; color: #7c3aed; display: flex; align-items: center; gap: 6px; margin-bottom: 5px;">
                            <i class="fa-solid fa-brain"></i> AI Weak Areas Analysis
                        </strong>
                        <div id="ai-weak-areas-text" style="font-size: 0.8rem; margin: 0; line-height: 1.4; color: var(--text);">
                            Analyzing your performance...
                        </div>
                    </div>

                        <div class="result-actions">

                    <button class="btn-action" id="weak Areas Btn" onclick="analyze Weak Areas With AI()" style="background: linear-gradient(135deg, #7c3aed, #a78bfa); color: white; box-shadow: 0 4px 16px rgba(124,58,237,0.3);">
                        <i class="fa-solid fa-brain"></i> Analyze My Weak Areas
                    </button>

            <button class="btn-action" id="explain Btn" onclick="ask Renance AI()" style="background: linear-gradient(135deg, #1d4ed8, #1e40af); color: white; box-shadow: 0 4px 16px rgba(29,78,216,0.3);">
                <i class="fa-solid fa-robot"></i> Explain Missed Questions
            </button>
            <button class="btn-action btn-share" onclick="share Quiz Result()">
                <i class="fa-solid fa-share-nodes"></i> Share Score
            </button>
            <button class="btn-action btn-review" id="modal Review Btn" onclick="enter Review Mode()">
                <i class="fa-solid fa-magnifying-glass"></i> Review Answers
            </button>
            <button class="btn-action btn-home" onclick="go Home()">
                <i class="fa-solid fa-house"></i> Dashboard
            </button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = window.env?.SUPABASE_URL || 'https://ubxsywaxdvkhiqepcvmq.supabase.co';
    const SUPABASE_KEY = window.env?.SUPABASE_KEY || 'ey Jhb Gci Oi JIUz I1Ni Is In R5c CI6Ikp XVCJ9.ey Jpc3Mi Oi Jzd XBh Ym Fz ZSIs In Jl Zi I6In Vie HN5d2F4ZHZra Glx ZXBjdm1x Iiwicm9s ZSI6Im Fub24i LCJp YXQi Oj E3Nz E5ODcw MDAs Im V4c CI6Mj A4Nz U2Mz Aw MH0.gk R3Aud3LRLNy Nwp DHJTT0v Ir WCn Qk SBk FSa Fj Q5qy4';
    const db = supabase.create Client(SUPABASE_URL, SUPABASE_KEY);
    const COURSE_CODE = 'AMS 104';
    const STORAGE_KEY = 'saved_ams104_exam';

    async function send Heartbeat() {
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) return;
            await db.from('students').update({ last_seen: new Date().to ISOString() }).eq('id', user.id);
        } catch (e) {  }
    }
    send Heartbeat();
    set Interval(send Heartbeat, 2 * 60 * 1000);

    const MASTER_POOL = [
];

    let current Exam Data = [];
    let user Answers     = {};
    let current Index    = 0;
    let time Remaining   = 0;
    let timer Id         = null;
    let active Mode      = 'practice';
    let exam Selection Type = 'random';
    let part Num         = 1;
    let is Review Mode    = false;

    function build Dashboard() {
        const dash = document.get Element By Id('dashboard');
        dash.inner HTML = '';

        const total Q = MASTER_POOL.length;
        const part Size = 10;
        const num Parts = Math.ceil(total Q / part Size);

        const random Box = document.create Element('div');
        random Box.class Name = 'box box-random';
        random Box.inner HTML = `<i class="fa-solid fa-shuffle" style="font-size:2rem;"></i><h3>Random Mix</h3><p>${total Q} Questions</p>`;
        random Box.onclick = () => open Setup('random', 0);
        dash.append Child(random Box);

        for (let p = 1; p <= num Parts; p++) {
            const start = (p - 1) * part Size + 1;
            const end   = Math.min(p * part Size, total Q);
            const box   = document.create Element('div');
            box.class Name = 'box';
            box.inner HTML = `<i class="fa-solid fa-book-open" style="font-size:2rem; color:var(--primary);"></i><h3>Part ${p}</h3><p>Q${start} – Q${end}</p>`;
            box.onclick = () => open Setup('part', p);
            dash.append Child(box);
        }
    }

    function open Setup(type, part) {
        exam Selection Type = type;
        part Num = part;
        document.get Element By Id('dashboard-wrap').style.display = 'none';
        document.get Element By Id('setup-screen').style.display   = 'block';
        document.get Element By Id('setup-title').inner Text = type === 'random' ? 'Randomised Practice' : `${COURSE_CODE} — Part ${part}`;
        document.get Element By Id('random-settings').style.display = type === 'random' ? 'block' : 'none';
    }

    function go Home() {
        clear Interval(timer Id);
        is Review Mode = false;
        current Exam Data = []; user Answers = {}; current Index = 0;
        document.get Element By Id('quiz-interface').style.display  = 'none';
        document.get Element By Id('setup-screen').style.display    = 'none';
        document.get Element By Id('quiz Result Modal').style.display = 'none';
        document.get Element By Id('dashboard-wrap').style.display  = 'block';
        show Resume Banner();
        load Stats Bar();
    }

    function shuffle Array(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function start Exam() {
        time Remaining = parse Int(document.get Element By Id('t-limit').value) * 60;
        active Mode    = document.get Element By Id('quiz-mode').value;
        is Review Mode  = false;
        user Answers   = {};
        current Index  = 0;

        let pool = JSON.parse(JSON.stringify(MASTER_POOL));

        if (exam Selection Type === 'random') {
            const qty = Math.min(parse Int(document.get Element By Id('q-count').value), pool.length);
            pool = shuffle Array(pool).slice(0, qty);
        } else {
            const start = (part Num - 1) * 10;
            pool = pool.slice(start, start + 10);
        }

        if (document.get Element By Id('shuffle-questions').checked) pool = shuffle Array(pool);

        if (document.get Element By Id('shuffle-options').checked) {
            pool.for Each(q => {
                q.options = shuffle Array([...q.options]);
            });
        }

        current Exam Data = pool;

        document.get Element By Id('setup-screen').style.display  = 'none';
        document.get Element By Id('quiz-interface').style.display = 'block';
        document.get Element By Id('total-idx').inner Text = current Exam Data.length;
        run Timer();
        render Question();
    }

    function run Timer() {
        clear Interval(timer Id);
        timer Id = set Interval(() => {
            time Remaining--;
            const m = Math.floor(time Remaining / 60);
            const s = time Remaining % 60;
            document.get Element By Id('timer').inner Text = `${m}:${s < 10 ? '0'+s : s}`;
            if (time Remaining <= 0) { clear Interval(timer Id); show Results(true); }
        }, 1000);
    }

    // Render Question
    function render Question() {
        const q          = current Exam Data[current Index];
        const has Answered = user Answers.has Own Property(current Index);
        const user Ans    = user Answers[current Index];
        const labels     = ['A','B','C','D'];

        document.get Element By Id('cur-idx').inner Text       = current Index + 1;
        document.get Element By Id('question-text').inner HTML = q.question;

        const opt Box   = document.get Element By Id('options-box');
        const feed Area = document.get Element By Id('feedback-area');
        opt Box.inner HTML  = '';
        feed Area.inner HTML = '';

        q.options.for Each((val, idx) => {
            const label = labels[idx] || (idx + 1);
            const btn   = document.create Element('button');
            btn.class Name = 'option-btn';
            btn.inner HTML = `<strong>${label}.</strong> ${val}`;

            if (is Review Mode || (active Mode === 'practice' && has Answered)) {
                if (val === q.answer)    btn.class List.add('correct');
                else if (user Ans === val) btn.class List.add('wrong');
                btn.disabled = true;
            } else if (active Mode === 'exam' && has Answered && user Ans === val) {
                btn.class List.add('selected');
            }

            btn.onclick = () => {
                if (is Review Mode) return;
                if (active Mode === 'practice' && has Answered) return;
                user Answers[current Index] = val;
                save State();
                render Question();

                if (active Mode === 'practice') {
                    const is Last = current Index === current Exam Data.length - 1;
                    if (!is Last) {
                        set Timeout(() => { current Index++; render Question(); }, 1200);
                    } else {
                        set Timeout(() => show Results(true), 1200);
                    }
                }

    async function save Test Score(pct) {
        const el = document.get Element By Id('save-status');
        el.inner Text = '⏳ Saving...';
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) { el.inner Text = ''; return; }

            // ── 1. ALWAYS save to local Storage as backup (cross-device sync) ──
            try {
                const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
                local Results.push({
                    student_id: user.id,
                    course_id: COURSE_CODE,
                    score: pct,
                    timestamp: Date.now(),
                    synced: false
                });
                local Storage.set Item('renance_local_results', JSON.stringify(local Results));
            } catch (le) { console.warn('Local save failed:', le); }

            // ── 2. Save to Supabase (cloud) ──
            const { data: prev } = await db.from('test_results')
                .select('score').eq('student_id', user.id).eq('course_id', COURSE_CODE);

            if (prev && prev.length > 0) {
                const all = [...prev.map(r => r.score), pct];
                const avg = Math.round(all.reduce((a, b) => a + b, 0) / all.length);
                document.get Element By Id('modal Avg').inner Text = avg + '%';
            }

            const { error } = await db.from('test_results').insert([
                { student_id: user.id, course_id: COURSE_CODE, score: pct }
            ]);

            if (error) {
                el.inner Text = '⚠️ Could not save to cloud (saved locally — will sync later)';
            } else {
                el.inner Text = '✅ Score saved!';
                // Mark the just-saved local result as synced
                try {
                    const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
                    // Mark the last unsynced result for this course as synced
                    for (let i = local Results.length - 1; i >= 0; i--) {
                        if (local Results[i].student_id === user.id &&
                            local Results[i].course_id === COURSE_CODE &&
                            !local Results[i].synced) {
                            local Results[i].synced = true;
                            break;
                        }
                    }
                    local Storage.set Item('renance_local_results', JSON.stringify(local Results));
                } catch (e) {}

                // ── Update students table with aggregated stats ──
                try {
                    const { data: all Results } = await db.from('test_results')
                        .select('score').eq('student_id', user.id);
                    if (all Results && all Results.length > 0) {
                        const tests Taken = all Results.length;
                        const avg Score = Math.round(all Results.reduce((s, r) => s + Number(r.score), 0) / tests Taken);
                        await db.from('students').update({
                            tests_taken: tests Taken,
                            avg_score: avg Score,
                            last_seen: new Date().to ISOString()
                        }).eq('id', user.id);
                    }
                } catch (ue) {}
            }
        } catch (e) {
            el.inner Text = '⚠️ Offline — saved locally, will sync when online';
        }
    }

    // ── Sync queued local results to Supabase (runs on page load) ──
    async function sync Local Results() {
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) return;

            const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
            const unsynced = local Results.filter(r => !r.synced && r.student_id === user.id);
            if (unsynced.length === 0) return;

            let synced Count = 0;
            for (const r of unsynced) {
                try {
                    const { error } = await db.from('test_results').insert([
                        { student_id: r.student_id, course_id: r.course_id, score: r.score }
                    ]);
                    if (!error) {
                        r.synced = true;
                        synced Count++;
                    }
                } catch (e) { /* will retry next time */ }
            }
            local Storage.set Item('renance_local_results', JSON.stringify(local Results));
            if (synced Count > 0) {
                console.log(`Synced ${synced Count} queued result(s) to cloud`);

            // Update students table after syncing
            if (synced Count > 0) {
                try {
                    const { data: { user } } = await db.auth.get User();
                    if (user) {
                        const { data: all Results } = await db.from('test_results')
                            .select('score').eq('student_id', user.id);
                        if (all Results && all Results.length > 0) {
                            const tests Taken = all Results.length;
                            const avg Score = Math.round(all Results.reduce((s, r) => s + Number(r.score), 0) / tests Taken);
                            await db.from('students').update({
                                tests_taken: tests Taken,
                                avg_score: avg Score,
                                last_seen: new Date().to ISOString()
                            }).eq('id', user.id);
                        }
                    }
                } catch (ue) {}
            }
            }
        } catch (e) { /* not logged in or offline — will retry next time */ }
    }

        async function load Course Leaderboard() {
            const lb Content = document.get Element By Id('lb-content');

            const lb Course Name = document.get Element By Id('lb-course-name');
            if (lb Course Name) lb Course Name.inner Text = COURSE_CODE;
            if (!lb Content) return;

            try {
                // Fetch all test_results for this course
                const { data: results, error: r Err } = await db
                    .from('test_results')
                    .select('student_id, score')
                    .eq('course_id', COURSE_CODE);

                if (r Err) throw r Err;
                if (!results || results.length === 0) {
                    lb Content.inner HTML = '<p style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:1.5rem;">No scores yet for this course. Be the first!</p>';
                    lb Status.inner Text = '0 attempts';
                    return;
                }

                // Aggregate by student: avg score + count
                const by Student = {};
                results.for Each(r => {
                    if (!by Student[r.student_id]) {
                        by Student[r.student_id] = { total: 0, count: 0 };
                    }
                    by Student[r.student_id].total += Number(r.score);
                    by Student[r.student_id].count += 1;
                });

                // Fetch student profiles
                const student Ids = Object.keys(by Student);
                const { data: students, error: s Err } = await db
                    .from('students')
                    .select('id, fullname, department, matric')
                    .in('id', student Ids);

                // Build leaderboard rows
                const rows = student Ids.map(sid => {
                    const agg = by Student[sid];
                    const avg = Math.round(agg.total / agg.count);
                    const student = students ? students.find(s => s.id === sid) : null;
                    return {
                        fullname: student ? student.fullname : 'Anonymous',
                        department: student ? (student.department || '—') : '—',
                        matric: student ? (student.matric || '—') : '—',
                        avg: avg,
                        tests: agg.count
                    };
                });

                // Sort by avg score desc, then by tests desc
                rows.sort((a, b) => b.avg - a.avg || b.tests - a.tests);

                // Get current user id for highlighting
                let current User Id = null;
                try {
                    const { data: { user } } = await db.auth.get User();

                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [{ role: "system", content: system Prompt }],
                        temperature: 0.3
                    })
                });
                const res Data = await response.json();
                if (!response.ok) throw new Error(res Data.error?.message || `HTTP ${response.status}`);
                result Text = res Data.choices[0].message.content;

                // Format the response
                const formatted = result Text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
                text El.inner HTML = formatted;
            } catch (err) {
                // Fallback: show topic-based analysis without AI
                if (topic Summary) {
                    text El.inner HTML = `Based on your missed questions, focus on: <br><strong>${topic Summary}</strong><br><br>Review these topics in your course materials and try again!`;
                } else {
                    text El.inner HTML = `You missed ${missed.length} out of ${current Exam Data.length} questions. Review the missed questions above and try again!`;
                }
            }
        }


</script>
