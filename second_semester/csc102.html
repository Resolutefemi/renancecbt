    <style>
        :root {
            --primary: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --accent: #ea580c;
            --border: rgba(0,0,0,0.07);
            --share-gradient: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #7c3aed 100%);
        }
        .dark-mode {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255,255,255,0.07);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: background 0.3s, color 0.3s; min-height: 100vh; }

        nav {
            background: var(--card-bg); padding: 0.9rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            position: sticky; top: 0; z-index: 100; gap: 10px; flex-wrap: wrap;
        }
        .nav-brand { font-weight: 700; font-size: 1.05rem; color: var(--primary); }

        main { padding: 2rem 5%; max-width: 960px; margin: 0 auto; }


        #resume-banner {
            display: none; background: var(--card-bg);
            border: 1.5px solid var(--success); border-radius: 14px;
            padding: 1rem 1.2rem; margin-bottom: 1.2rem;
            box-shadow: 0 2px 10px rgba(22,163,74,0.1);
        }


        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card-bg); border-radius: 12px; padding: 1rem; text-align: center; border: 1.5px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .stat-card .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .stat-card .stat-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }


        #dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.1rem; }
        .box {
            background: var(--card-bg); padding: 1.5rem 1rem; border-radius: 14px;
            text-align: center; cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            border: 1.5px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .box:hover { transform: translate Y(-5px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(30,64,175,0.12); }
        .box h3 { margin: 10px 0 4px; font-size: 1rem; line-height: 1.4; }
        .box p { font-size: 0.82rem; color: var(--text-muted); margin: 0; }
        .box-random { background: linear-gradient(135deg, #1e40af, #3b82f6) !important; color: white !important; border: none !important; }
        .box-random p { color: rgba(255,255,255,0.8) !important; }


        #setup-screen { text-align: center; background: var(--card-bg); padding: 3rem 2rem; border-radius: 16px; border: 1.5px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .setup-group { margin: 1.5rem auto; text-align: left; max-width: 360px; }
        .setup-group label { font-weight: 600; font-size: 0.88rem; color: var(--text); display: block; margin-bottom: 7px; }
        .setup-input { width: 100%; padding: 11px 14px; border: 2px solid #e2e8f0; border-radius: 9px; font-size: 0.95rem; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s; }
        .setup-input:focus { border-color: var(--primary); }
        .checkbox-group { display: flex; flex-direction: column; gap: 12px; margin-top: 1rem; background: rgba(0,0,0,0.02); padding: 14px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .custom-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text); font-weight: 500; user-select: none; }
        .custom-checkbox input { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }


        .quiz-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 15px; padding: 0 4px; flex-wrap: wrap; gap: 10px; }
        .q-counter { font-size: 1rem; color: var(--text); }
        .btn-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #timer { color: var(--danger); background: rgba(220,38,38,0.08); padding: 6px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 700; }
        #part-text { color: var(--accent); font-weight: 700; margin-bottom: 0.5rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; }

        .question-card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1.5px solid var(--border); }
        #question-text { line-height: 1.7; margin-bottom: 1.5rem; font-size: 1.05rem; word-wrap: break-word; }

        .option-btn {
            display: block; width: 100%; padding: 0.95rem 1.1rem; margin: 0.65rem 0;
            border: 2px solid #e2e8f0; border-radius: 10px; background: var(--card-bg);
            color: var(--text); text-align: left; cursor: pointer;
            font-size: 0.97rem; transition: background 0.15s, border-color 0.15s; line-height: 1.5;
        }
        .option-btn:not(:disabled):hover { background: #f1f5f9; border-color: #cbd5e1; }
        .option-btn.selected { background: #e0f2fe !important; border-color: #3b82f6 !important; color: #0369a1 !important; }
        .option-btn.correct  { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; font-weight: 700; }
        .option-btn.wrong    { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        .feedback-msg { margin-top: 1.2rem; padding: 1.2rem; border-radius: 12px; font-weight: 600; animation: fade In 0.3s; line-height: 1.6; }
        .explanation-box { background: rgba(30,64,175,0.07); border-left: 4px solid var(--primary); padding: 1rem; border-radius: 6px; margin-top: 10px; font-weight: 400; font-size: 0.88rem; line-height: 1.6; color: var(--text); }
        .dark-mode .explanation-box { background: rgba(30,64,175,0.15); }
        @keyframes fade In { from { opacity: 0; transform: translate Y(8px); } to { opacity: 1; transform: translate Y(0); } }

        .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 1.8rem; }
        .btn { padding: 0.8rem 1.6rem; border: none; border-radius: 9px; cursor: pointer; font-weight: 700; background: var(--primary); color: white; transition: opacity 0.2s, transform 0.2s; font-size: 0.95rem; }
        .btn:hover { opacity: 0.88; transform: translate Y(-2px); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }


        .result-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(8px); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .result-modal-content { background: var(--card-bg); padding: 40px 28px; border-radius: 24px; width: 100%; max-width: 420px; text-align: center; color: var(--text); box-shadow: 0 25px 60px rgba(0,0,0,0.45); animation: bounce In 0.55s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes bounce In { 0% { opacity:0; transform:scale(0.78) translate Y(30px); } 100% { opacity:1; transform:scale(1) translate Y(0); } }
        .result-icon { font-size: 3.6rem; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform:translate Y(0); } 50% { transform:translate Y(-10px); } }
        .score-display { background: rgba(37,99,235,0.06); border: 2px dashed rgba(37,99,235,0.2); border-radius: 18px; padding: 18px; margin: 18px 0; }
        .score-big { font-size: 3.5rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .stats-mini { display: flex; justify-content: center; gap: 24px; margin: 10px 0 4px; }
        .stats-mini .sm { text-align: center; }
        .stats-mini .sm .sv { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stats-mini .sm .sl { font-size: 0.72rem; color: var(--text-muted); }
        #save-status { font-size: 0.78rem; color: var(--text-muted); margin: 8px 0 14px; }
        .result-actions { display: flex; flex-direction: column; gap: 11px; }
        .btn-action { width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 0.97rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 9px; }
        .btn-action:hover { opacity: 0.9; transform: translate Y(-1px); }
        .btn-share  { background: var(--share-gradient); color: white; box-shadow: 0 4px 16px rgba(37,99,235,0.3); }
        .btn-review { background: rgba(30,64,175,0.08); color: var(--primary); border: 1.5px solid rgba(30,64,175,0.2); }
        .btn-home   { background: rgba(100,116,139,0.09); color: var(--text); border: 1.5px solid var(--border); }


        @media (max-width: 600px) {
            #dashboard { grid-template-columns: repeat(2, 1fr); }
            .question-card { padding: 1.3rem; }
            .result-modal-content { padding: 28px 18px; }
            .score-big { font-size: 2.8rem; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<nav>
    <div class="nav-brand">
        <div><i class="fa-solid fa-cpu"></i> CSC 102 Practice Portal</div>
        <div style="font-size:0.9rem; font-weight:600; color:var(--text-muted); letter-spacing:0.3px;">by Resolute Femi</div>
    </div>
    
</nav>

<main>
    <div id="dashboard-wrap">

    <div id="setup-screen" style="display:none;">

            <select id="quiz-mode" class="setup-input">
                <option value="practice">Practice Mode (Instant Answers)</option>
                <option value="exam">Exam Mode (Answers at End)</option>
            </select>
        </div>

        <div id="random-settings">
            <div class="setup-group">
                <label>Question Quantity:</label>
                <input type="number" id="q-count" value="50" class="setup-input" min="1" max="999">
            </div>
        </div>

        <div class="setup-group">
            <label>Time Limit (Minutes):</label>
            <input type="number" id="t-limit" value="30" class="setup-input" min="1">
        </div>

        <div class="setup-group checkbox-group">
            <label class="custom-checkbox">
                <input type="checkbox" id="shuffle-questions" checked> Shuffle Questions
            </label>
            <label class="custom-checkbox">
                <input type="checkbox" id="shuffle-options" checked> Shuffle Options (A, B, C, D)
            </label>
        </div>

        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:1.8rem;">
            <button class="btn" style="background:#64748b;" onclick="go Home()">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <button class="btn" onclick="start Exam()" style="min-width:160px;">
                Start Now <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="quiz-interface" style="display:none;">
        <div class="quiz-header">
            <span class="q-counter">Question <span id="cur-idx">1</span> / <span id="total-idx">0</span></span>
            <div class="btn-group">
                <button class="btn" id="submit-btn" style="background:var(--success); display:none; padding:8px 15px; font-size:0.87rem;" onclick="show Results()">
                    <i class="fa-solid fa-paper-plane"></i> Submit
                </button>
                <button class="btn" id="finish-review-btn" style="display:none; padding:8px 15px; font-size:0.87rem;" onclick="go Home()">
                    <i class="fa-solid fa-house"></i> Exit Review
                </button>
                <span id="timer">30:00</span>
            </div>
        </div>

        <div class="question-card">
            <div id="part-text"></div>
            <h3 id="question-text"></h3>
            <div id="options-box"></div>
            <div id="feedback-area"></div>
        </div>

        <div class="controls">
            <button class="btn" style="background:#64748b;" id="prev-btn" onclick="move(-1)">
                <i class="fa-solid fa-arrow-left"></i> Previous
            </button>
            <button class="btn" id="next-btn" onclick="move(1)">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
</main>

<div id="quiz Result Modal" class="result-modal-overlay" style="display:none;">
    <div class="result-modal-content">

                <div class="sm"><div class="sv" id="modal Avg">—</div><div class="sl">Your Avg</div></div>
            </div>
        </div>

        <p id="result Feedback" style="font-size:0.9rem; color:var(--text-muted); margin:0;"></p>
        <p id="save-status"></p>

async function load Stats Bar() {
        const bar = document.get Element By Id('stats-bar');
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) return;

            // Fetch from cloud
            const { data } = await db.from('test_results')
                .select('score').eq('student_id', user.id).eq('course_id', COURSE_CODE);
            const cloud Scores = data ? data.map(r => r.score) : [];

            // Merge with local (unsynced) results
            let local Scores = [];
            try {
                const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
                local Scores = local Results
                    .filter(r => r.student_id === user.id && r.course_id === COURSE_CODE && !r.synced)
                    .map(r => r.score);
            } catch (e) {}

            const all Scores = [...cloud Scores, ...local Scores];
            if (all Scores.length === 0) return;

            const taken = all Scores.length;
            const avg  = Math.round(all Scores.reduce((s, r) => s + r, 0) / taken);
            const best = Math.max(...all Scores);
            bar.inner HTML = `
                <div class="stat-card"><div class="stat-val">${taken}</div><div class="stat-lbl">Tests Taken</div></div>

    function shuffle Array(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function start Exam() {
        time Remaining = parse Int(document.get Element By Id('t-limit').value) * 60;
        active Mode    = document.get Element By Id('quiz-mode').value;
        is Review Mode  = false;
        user Answers   = {};
        current Index  = 0;

        let pool = JSON.parse(JSON.stringify(MASTER_POOL));

        if (exam Selection Type === 'random') {
            const qty = Math.min(parse Int(document.get Element By Id('q-count').value), pool.length);
            pool = shuffle Array(pool).slice(0, qty);
        } else if (exam Selection Type === 'part') {
            // Slice questions for the selected part (50 per part)
            const part Size = 50;
            const start = (current Part Num - 1) * part Size;
            pool = pool.slice(start, start + part Size);
        }

        if (document.get Element By Id('shuffle-questions').checked) pool = shuffle Array(pool);

        if (document.get Element By Id('shuffle-options').checked) {
            pool.for Each(q => { q.options = shuffle Array([...q.options]); });
        }

        current Exam Data = pool;
        document.get Element By Id('setup-screen').style.display  = 'none';
        document.get Element By Id('quiz-interface').style.display = 'block';
        document.get Element By Id('total-idx').inner Text = current Exam Data.length;
        run Timer();
        render Question();
    }

    function run Timer() {
        clear Interval(timer Id);
        timer Id = set Interval(() => {
            time Remaining--;
            const m = Math.floor(time Remaining / 60);
            const s = time Remaining % 60;
            document.get Element By Id('timer').inner Text = `${m}:${s < 10 ? '0'+s : s}`;
            if (time Remaining <= 0) { clear Interval(timer Id); show Results(true); }
        }, 1000);
    }

        const q           = current Exam Data[current Index];
        const has Answered = user Answers.has Own Property(current Index);
        const user Ans     = user Answers[current Index];
        const labels      = ['A','B','C','D','E','F'];

        document.get Element By Id('cur-idx').inner Text    = current Index + 1;
        document.get Element By Id('part-text').inner Text   = selection Value || 'Random Mix';
        document.get Element By Id('question-text').inner HTML = q.question;

        const opt Box   = document.get Element By Id('options-box');
        const feed Area = document.get Element By Id('feedback-area');
        opt Box.inner HTML = '';
        feed Area.inner HTML = '';

        document.get Element By Id('submit-btn').style.display       = (active Mode === 'exam' && !is Review Mode) ? 'inline-flex' : 'none';
        document.get Element By Id('finish-review-btn').style.display = is Review Mode ? 'inline-flex' : 'none';

        q.options.for Each((opt, i) => {
            const btn = document.create Element('button');
            btn.class Name = 'option-btn';
            btn.inner Text = `${labels[i]}. ${opt}`;

            if (is Review Mode) {
                btn.disabled = true;
                if (opt === q.answer) btn.class List.add('correct');
                if (has Answered && user Ans === opt && opt !== q.answer) btn.class List.add('wrong');
            } else if (has Answered) {
                btn.disabled = true;
                if (active Mode === 'practice') {
                    if (opt === q.answer) btn.class List.add('correct');
                    if (user Ans === opt && opt !== q.answer) btn.class List.add('wrong');
                    if (user Ans === opt) btn.class List.add('selected');
                } else {
                    if (user Ans === opt) btn.class List.add('selected');
                }
            } else {
                btn.onclick = () => select Option(i);
            }
            opt Box.append Child(btn);
        });

        if (has Answered && active Mode === 'practice' && !is Review Mode) {
            const is Correct = user Ans === q.answer;
            feed Area.inner HTML = `
                <div class="feedback-msg" style="background:${is Correct ? 'rgba(22,163,74,0.08)' : 'rgba(220,38,38,0.08)'}; color:${is Correct ? 'var(--success)' : 'var(--danger)'};">

    function show Results(auto = false) {
        if (!auto && active Mode === 'exam') {

            if (unanswered > 0) {

        let correct = 0;
        current Exam Data.for Each((q, i) => { if (user Answers[i] === q.answer) correct++; });

        const total = current Exam Data.length;
        const score = Math.round((correct / total) * 100);

        document.get Element By Id('result Icon').inner Text       = icon;

        document.get Element By Id('result Feedback').inner Text   = feedback;
        document.get Element By Id('explain Btn').style.display   = wrong > 0 ? 'flex' : 'none';

        save To Supabase(score, correct, total);
        calc Average(score).then(avg => {
            document.get Element By Id('modal Avg').inner Text = avg !== null ? avg + '%' : '—';

    async function calc Average(latest Score) {
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) return null;
            const { data } = await db.from('test_results').select('score').eq('student_id', user.id).eq('course_id', COURSE_CODE);
            if (!data || data.length === 0) return latest Score;
            return Math.round(data.reduce((s, r) => s + r.score, 0) / data.length);
        } catch (e) { return null; }
    }

    async function save To Supabase(score, correct, total) {
        const status El = document.get Element By Id('save-status');
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) { status El.inner Text = '⚠️ Not logged in — score not saved.'; return; }

            // ── Always save to local Storage as backup (cross-device sync) ──
            try {
                const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
                local Results.push({
                    student_id: user.id, course_id: COURSE_CODE,
                    score, correct, total, mode: active Mode,
                    timestamp: Date.now(), synced: false
                });
                local Storage.set Item('renance_local_results', JSON.stringify(local Results));
            } catch (le) {}

            const { error } = await db.from('test_results').insert({
                student_id: user.id, course_id: COURSE_CODE,
                score, correct, total, mode: active Mode,
                created_at: new Date().to ISOString()
            });
            if (error) throw error;
            status El.inner Text = '✅ Score saved successfully.';

            // Mark local result as synced
            try {
                const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
                for (let i = local Results.length - 1; i >= 0; i--) {
                    if (local Results[i].student_id === user.id && local Results[i].course_id === COURSE_CODE && !local Results[i].synced) {
                        local Results[i].synced = true; break;
                    }
                }
                local Storage.set Item('renance_local_results', JSON.stringify(local Results));
            } catch (e) {}
        } catch (e) {
            status El.inner Text = '⚠️ Saved locally — will sync when online.';
        }
    }

    // Sync queued local results to Supabase
    async function sync Local Results() {
        try {
            const { data: { user } } = await db.auth.get User();
            if (!user) return;
            const local Results = JSON.parse(local Storage.get Item('renance_local_results') || '[]');
            const unsynced = local Results.filter(r => !r.synced && r.student_id === user.id);
            if (unsynced.length === 0) return;
            let synced Count = 0;
            for (const r of unsynced) {
                try {
                    const { error } = await db.from('test_results').insert({
                        student_id: r.student_id, course_id: r.course_id, score: r.score
                    });
                    if (!error) { r.synced = true; synced Count++; }
                } catch (e) {}
            }
            local Storage.set Item('renance_local_results', JSON.stringify(local Results));
            if (synced Count > 0) {
                console.log(`Synced ${synced Count} queued result(s)`);

            // Update students table after syncing
            if (synced Count > 0) {
                try {
                    const { data: { user } } = await db.auth.get User();
                    if (user) {
                        const { data: all Results } = await db.from('test_results')
                            .select('score').eq('student_id', user.id);
                        if (all Results && all Results.length > 0) {
                            const tests Taken = all Results.length;
                            const avg Score = Math.round(all Results.reduce((s, r) => s + Number(r.score), 0) / tests Taken);
                            await db.from('students').update({
                                tests_taken: tests Taken,
                                avg_score: avg Score,
                                last_seen: new Date().to ISOString()
                            }).eq('id', user.id);
                        }
                    }
                } catch (ue) {}
            }
            }
        } catch (e) {}
    }

                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generate Content?key=${key}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{parts:[{text:sp}]}], generation Config:{response Mime Type:"application/json"} }) });
                    const d = await resp.json();
                    if (!resp.ok) throw new Error(d.error?.message || `HTTP ${resp.status}`);
                    r = JSON.parse(d.candidates[0].content.parts[0].text.trim());
                }
                if (r && typeof r.score === 'number') {
                    ft.inner HTML = `<strong>AI Grade:</strong> ${r.score}%<br><strong>AI Feedback:</strong> ${r.feedback}`;
                    fb.style.display = 'block';
                    user Answers[current Index] = { response: ur, score: r.score, ai Feedback: r.feedback };
                    save State(); set Timeout(() => render Question(), 800);
                } else throw new Error("Invalid response");
            } catch (e) { console.error(e); alert(`Auto-grading failed: ${e.message}`); }
            finally { btn.disabled = false; btn.inner Text = "\u D83E\u DD16 Auto-Grade (AI)"; }
        }

        // ═════════════════════════════════════════════════════════════════
        // PER-COURSE LEADERBOARD
        // ═════════════════════════════════════════════════════════════════
        async function load Course Leaderboard() {
            const lb Content = document.get Element By Id('lb-content');
            const lb Status = document.get Element By Id('lb-status');
            const lb Course Name = document.get Element By Id('lb-course-name');
            if (lb Course Name) lb Course Name.inner Text = COURSE_CODE;
            if (!lb Content) return;

            try {
                // Fetch all test_results for this course
                const { data: results, error: r Err } = await db
                    .from('test_results')
                    .select('student_id, score')
                    .eq('course_id', COURSE_CODE);

                if (r Err) throw r Err;
                if (!results || results.length === 0) {
                    lb Content.inner HTML = '<p style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:1.5rem;">No scores yet for this course. Be the first!</p>';
                    lb Status.inner Text = '0 attempts';
                    return;
                }

                // Aggregate by student: avg score + count
                const by Student = {};
                results.for Each(r => {
                    if (!by Student[r.student_id]) {
                        by Student[r.student_id] = { total: 0, count: 0 };
                    }
                    by Student[r.student_id].total += Number(r.score);
                    by Student[r.student_id].count += 1;
                });

                // Fetch student profiles
                const student Ids = Object.keys(by Student);
                const { data: students, error: s Err } = await db
                    .from('students')
                    .select('id, fullname, department, matric')
                    .in('id', student Ids);

                // Build leaderboard rows
                const rows = student Ids.map(sid => {
                    const agg = by Student[sid];
                    const avg = Math.round(agg.total / agg.count);
                    const student = students ? students.find(s => s.id === sid) : null;
                    return {
                        fullname: student ? student.fullname : 'Anonymous',
                        department: student ? (student.department || '—') : '—',
                        matric: student ? (student.matric || '—') : '—',
                        avg: avg,
                        tests: agg.count
                    };
                });

                // Sort by avg score desc, then by tests desc
                rows.sort((a, b) => b.avg - a.avg || b.tests - a.tests);

                // Get current user id for highlighting
                let current User Id = null;
                try {
                    const { data: { user } } = await db.auth.get User();
                    if (user) current User Id = user.id;
                } catch (e) {}

                // Render top 20
                const medals = ['🥇', '🥈', '🥉'];
                const top Rows = rows.slice(0, 20);
                let html = '<table style="width:100%; border-collapse:collapse; font-size:0.88rem;">';
                html += '<thead><tr style="border-bottom:2px solid var(--border);">';
                html += '<th style="text-align:left; padding:8px; color:var(--text-muted); font-size:0.78rem;">#</th>';
                html += '<th style="text-align:left; padding:8px; color:var(--text-muted); font-size:0.78rem;">Name</th>';
                html += '<th style="text-align:left; padding:8px; color:var(--text-muted); font-size:0.78rem; display:none;" class="lb-dept-col">Dept</th>';
                html += '<th style="text-align:center; padding:8px; color:var(--text-muted); font-size:0.78rem;">Tests</th>';
                html += '<th style="text-align:right; padding:8px; color:var(--text-muted); font-size:0.78rem;">Avg Score</th>';
                html += '</tr></thead><tbody>';
                top Rows.for Each((row, i) => {
                    const rank = i + 1;
                    const medal = medals[i] || '';
                    const highlight = row.id === current User Id ? 'background:rgba(124,58,237,0.08);' : '';
                    html += `<tr style="border-bottom:1px solid var(--border); ${highlight}">`;
                    html += `<td style="padding:8px; font-weight:700;">${medal || rank}</td>`;
                    html += `<td style="padding:8px;">${row.fullname}<br><span style="font-size:0.72rem; color:var(--text-muted);">${row.matric}</span></td>`;
                    html += `<td style="padding:8px; display:none;" class="lb-dept-col">${row.department}</td>`;
                    html += `<td style="padding:8px; text-align:center;">${row.tests}</td>`;
                    html += `<td style="padding:8px; text-align:right; font-weight:700; color:${row.avg >= 70 ? '#10b981' : row.avg >= 40 ? '#f59e0b' : '#ef4444'};">${row.avg}%</td>`;
                    html += '</tr>';
                });
                html += '</tbody></table>';

                // If current user is not in top 20, show their rank below
                if (current User Id) {
                    const user Row Idx = rows.find Index(r => r.id === current User Id);
                    if (user Row Idx >= 20) {
                        const user Row = rows[user Row Idx];
                        html += `<div style="margin-top:10px; padding:10px; background:rgba(124,58,237,0.08); border-radius:8px; display:flex; justify-content:space-between; font-size:0.85rem;">
                            <span><strong>Your Rank: #${user Row Idx + 1}</strong> — ${user Row.fullname}</span>
                            <span><strong style="color:${user Row.avg >= 70 ? '#10b981' : user Row.avg >= 40 ? '#f59e0b' : '#ef4444'};">${user Row.avg}%</strong> (${user Row.tests} tests)</span>
                        </div>`;
                    }
                }

                lb Content.inner HTML = html;
                lb Status.inner Text = `${rows.length} students · ${results.length} attempts`;
            } catch (e) {
                console.error('Leaderboard error:', e);
                lb Content.inner HTML = '<p style="font-size:0.85rem; color:var(--danger); text-align:center; padding:1.5rem;">Could not load leaderboard. Please try again later.</p>';
                lb Status.inner Text = 'Error';
            }
        }

        // Load leaderboard after page loads
        document.add Event Listener('DOMContent Loaded', function() {
            set Timeout(load Course Leaderboard, 500);
        });

        // ═════════════════════════════════════════════════════════════════
        // AI WEAK AREAS ANALYSIS (runs after exam results are shown)
        // ═════════════════════════════════════════════════════════════════
        async function analyze Weak Areas With AI() {
            const container = document.get Element By Id('ai-weak-areas');
            const text El = document.get Element By Id('ai-weak-areas-text');
            if (!container || !text El) return;
            if (typeof current Exam Data === 'undefined' || !current Exam Data.length) return;

            // Collect wrong answers
            const missed = [];
            current Exam Data.for Each((q, i) => {
                const student = user Answers[i];
                if (q.is Theory) {
                    const score Value = student && typeof student.score === 'number' ? student.score : 0;
                    if (score Value < 70) {
                        missed.push({ question: q.question, topic: q.topic || 'General' });
                    }
                } else {
                    if (student !== q.answer) {
                        missed.push({ question: q.question, topic: q.topic || 'General' });
                    }
                }
            });

            if (missed.length === 0) {
                container.style.display = 'block';
                container.style.border Color = '#10b981';
                container.query Selector('strong').style.color = '#10b981';
                text El.inner HTML = "🎉 Outstanding! You got a perfect score. No weak areas detected!";
                return;
            }

            container.style.display = 'block';
            text El.inner HTML = '<i class="fa-solid fa-spinner fa-spin"></i> Analyzing your weak areas...';

            const course Code = typeof COURSE_CODE !== 'undefined' ? COURSE_CODE : 'Course';
            const config = typeof get AIConfig For Course === 'function' ? get AIConfig For Course(course Code) : {
                provider: 'groq',
                model: window.env?.AI_MODEL || 'llama-3.1-8b-instant',
                key: window.env?.AI_API_KEY || ('gsk_71n Ddj9ca C9CGo XD0Qx SW' + 'Gdyb3FYct CCz V6YNHGz Ylj4O9Qpk Qcy')
            };

            // Group missed questions by topic if available
            const topic Groups = {};
            missed.for Each(m => {
                if (!topic Groups[m.topic]) topic Groups[m.topic] = 0;
                topic Groups[m.topic]++;
            });

            const missed List = missed.map((m, i) => `${i+1}. ${m.question.substring(0, 120)}`).join('\n');
            const topic Summary = Object.entries(topic Groups).map(([t, c]) => `${t}: ${c} wrong`).join(', ');

            const system Prompt = `You are Renance AI, an academic tutor for FUTA students.
The student just completed a ${course Code} quiz and got ${missed.length} question(s) wrong out of ${current Exam Data.length}.

Questions they got wrong:
${missed List}

${topic Summary ? 'Breakdown by topic: ' + topic Summary : ''}

Identify 1-3 core topics/concepts the student should focus on revising.
Respond in 2-4 short bullet points. Be specific and actionable.
Format: • Topic name — brief advice on what to study
Keep it concise (under 100 words total).`;

            try {
                let result Text = "";
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.key}`
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [{ role: "system", content: system Prompt }],
                        temperature: 0.3
                    })
                });
                const res Data = await response.json();
                if (!response.ok) throw new Error(res Data.error?.message || `HTTP ${response.status}`);
                result Text = res Data.choices[0].message.content;

                // Format the response
                const formatted = result Text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
                text El.inner HTML = formatted;
            } catch (err) {
                // Fallback: show topic-based analysis without AI
                if (topic Summary) {
                    text El.inner HTML = `Based on your missed questions, focus on: <br><strong>${topic Summary}</strong><br><br>Review these topics in your course materials and try again!`;
                } else {
                    text El.inner HTML = `You missed ${missed.length} out of ${current Exam Data.length} questions. Review the missed questions above and try again!`;
                }
            }
        }


</script>
