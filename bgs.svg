  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020818"/>
      <stop offset="35%" stop-color="#071230"/>
      <stop offset="70%" stop-color="#0f1e4a"/>
      <stop offset="100%" stop-color="#151a35"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f1a"/>
      <stop offset="100%" stop-color="#040c08"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1510"/>
      <stop offset="25%" stop-color="#1a3020"/>
      <stop offset="50%" stop-color="#223828"/>
      <stop offset="75%" stop-color="#1a3020"/>
      <stop offset="100%" stop-color="#0a1510"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2e1e"/>
      <stop offset="100%" stop-color="#0c1610"/>
