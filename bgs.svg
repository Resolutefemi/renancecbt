    <linearGradient id="coneGrad" cx="50%" cy="0%" r="100%" fx="50%" fy="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coneGrad" cx="50%" cy="0%" r="100%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#c8900e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8900e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fdf3c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%">
