<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENANCE — Reset Password</title>
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="env-loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb;--blue-dark:#1d4ed8;--blue-hover:#1e40af;
  --blue-shadow:rgba(37,99,235,0.35);
  --glass-bg: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.22);
  --glass-input: rgba(255,255,255,0.14);
  --glass-input-focus: rgba(255,255,255,0.22);
  --text-glass: #ffffff;
  --text-glass-muted: rgba(255,255,255,0.75);
}
html{height:100%}
body{min-height:100%;font-family:'Inter',sans-serif;color:#fff;overflow-x:hidden}

.bg-static{
  position:fixed;inset:0;z-index:0;
  background-image:url('bg.svg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
.page-overlay{
  position:fixed;inset:0;z-index:1;
  background:linear-gradient(135deg,
    rgba(3,7,30,0.72) 0%,
    rgba(15,23,55,0.60) 50%,
    rgba(3,7,30,0.78) 100%);
}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px)}

.layout{
  position:relative;z-index:10;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:24px 16px;
}
.card{
  width:100%;max-width:460px;
  background: var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:28px;
  padding:40px 36px 36px;
  box-shadow:
    0 32px 80px rgba(0,0,0,0.45),
    0 0 0 1px rgba(255,255,255,0.08),
    inset 0 1px 0 rgba(255,255,255,0.18);
  backdrop-filter:blur(28px) saturate(1.4);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);
  animation:cardIn 0.7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}

.card-header{text-align:center;margin-bottom:32px}
.gem-wrap{
  display:inline-flex;align-items:center;justify-content:center;
  width:68px;height:68px;
  background:linear-gradient(135deg,rgba(37,99,235,0.85),rgba(124,58,237,0.85));
  border-radius:20px;margin-bottom:14px;
  box-shadow:0 8px 32px rgba(37,99,235,0.5),inset 0 1px 0 rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.2);
}
.card-header h1{font-size:1.85rem;font-weight:800;color:#fff;letter-spacing:-0.5px;margin-bottom:6px}
.card-header p{font-size:0.9rem;color:var(--text-glass-muted)}

.field{margin-bottom:20px}
.field label{display:block;font-size:0.86rem;font-weight:600;color:rgba(255,255,255,0.9);margin-bottom:8px}
.field-wrap{position:relative;display:flex;align-items:center}
.field-icon{position:absolute;left:14px;color:rgba(255,255,255,0.45);pointer-events:none;font-size:0.95rem;transition:color 0.2s}
.field:focus-within .field-icon{color:rgba(255,255,255,0.9)}
.field input{
  width:100%;height:52px;
  background: var(--glass-input);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;
  padding:0 14px 0 44px;
  font-size:0.95rem;font-family:'Inter',sans-serif;color:#fff;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  -webkit-appearance:none;
}
.field input::placeholder{color:rgba(255,255,255,0.35)}
.field input:focus{
  background: var(--glass-input-focus);
  border-color:rgba(255,255,255,0.45);
  box-shadow:0 0 0 3px rgba(255,255,255,0.08);
}
.pw-toggle{position:absolute;right:14px;color:rgba(255,255,255,0.45);cursor:pointer;padding:8px;transition:color .2s;z-index:2}
.pw-toggle:hover{color:#fff}

.error-box{
  background:rgba(220,38,38,0.18);border:1px solid rgba(239,68,68,0.4);border-radius:12px;
  padding:12px 14px;margin-bottom:18px;
  font-size:0.83rem;color:#fca5a5;display:none;
  backdrop-filter:blur(8px);
}
.success-box{
  background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.4);border-radius:12px;
  padding:12px 14px;margin-bottom:18px;
  font-size:0.83rem;color:#a7f3d0;display:none;
  backdrop-filter:blur(8px);
}

.btn-primary{
  width:100%;height:52px;border:none;border-radius:14px;
  background:linear-gradient(135deg,rgba(29,78,216,0.9),rgba(37,99,235,0.9));
  color:#fff;font-family:'Inter',sans-serif;font-size:0.97rem;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 24px rgba(37,99,235,0.45),inset 0 1px 0 rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.15);
  transition:transform .15s,box-shadow .2s,background .2s;
}
.btn-primary:hover{
  background:linear-gradient(135deg,rgba(30,64,175,0.95),rgba(29,78,216,0.95));
  box-shadow:0 10px 32px rgba(37,99,235,.55);transform:translateY(-1px)
}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}

@media(max-width:600px){
  .layout{padding:16px 12px}
  .card{padding:30px 20px 26px;border-radius:22px}
  .card-header h1{font-size:1.55rem}
  .gem-wrap{width:56px;height:56px;border-radius:15px}
  .field input{font-size:16px!important;height:48px}
  .btn-primary{height:48px;font-size:0.9rem}
}
</style>
</head>
<body>

<div class="bg-static"></div>
<div class="page-overlay"></div>
<div class="scan"></div>

<div class="layout">
  <div class="card">

    <div class="card-header">
      <div class="gem-wrap">
        <i class="fa-solid fa-key" style="font-size:1.7rem;color:#fff"></i>
      </div>
      <h1>New Password</h1>
      <p>Enter a secure new password for your account</p>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <form id="resetForm" novalidate style="display:none;">
      <div class="field">
        <label>New Password</label>
        <div class="field-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" placeholder="••••••••" required>
          <i class="fa-solid fa-eye pw-toggle" id="togPw"></i>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <div class="field-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="confirmPassword" placeholder="••••••••" required>
          <i class="fa-solid fa-eye pw-toggle" id="togConfirmPw"></i>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <i class="fa-solid fa-circle-check"></i>
        <span>Update Password</span>
      </button>
    </form>

    <div id="initializingBox" style="text-align:center; padding: 20px 0;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--blue);"></i>
      <p style="margin-top: 12px; color: var(--text-glass-muted); font-size: 0.9rem;">Verifying secure reset link...</p>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = window.env?.SUPABASE_URL || 'https://ubxsywaxdvkhiqepcvmq.supabase.co';
const SUPABASE_KEY = window.env?.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHN5d2F4ZHZraGlxZXBjdm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5ODcwMDAsImV4cCI6MjA4NzU2MzAwMH0.gkR3Aud3LRLNyNwpDHJTT0vIrWCnQkSBkFSaFjQ5qy4';
if (!window._sb) window._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const db = window._sb;

function showError(msg){
  const box=document.getElementById('errorBox');
  box.textContent=msg; box.style.display='block';
}
function hideError(){document.getElementById('errorBox').style.display='none'}

function showSuccess(msg){
  const box=document.getElementById('successBox');
  box.textContent=msg; box.style.display='block';
}

// Password toggle
document.getElementById('togPw').addEventListener('click',function(){
  const p=document.getElementById('password'), t=p.type==='text';
  p.type=t?'password':'text';
  this.classList.toggle('fa-eye',t); this.classList.toggle('fa-eye-slash',!t);
});
document.getElementById('togConfirmPw').addEventListener('click',function(){
  const p=document.getElementById('confirmPassword'), t=p.type==='text';
  p.type=t?'password':'text';
  this.classList.toggle('fa-eye',t); this.classList.toggle('fa-eye-slash',!t);
});

// Verify session — handle recovery token from URL
async function verifySession() {
  try {
    // Give Supabase time to parse the hash fragment (recovery token)
    await new Promise(r => setTimeout(r, 1000));
    
    // Check if there's a hash fragment (recovery redirect)
    const hash = window.location.hash;
    if (hash && hash.includes('type=recovery')) {
      // Supabase should auto-parse this, but let's make sure
      const { data, error } = await db.auth.getSession();
      if (error || !data.session) {
        // Try to exchange the code explicitly
        const urlParams = new URLSearchParams(hash.substring(1));
        const access_token = urlParams.get('access_token');
        const refresh_token = urlParams.get('refresh_token');
        if (access_token && refresh_token) {
          const { data: setData, error: setError } = await db.auth.setSession({
            access_token,
            refresh_token
          });
          if (setError) throw setError;
        }
      }
    }
    
    const { data: { session }, error } = await db.auth.getSession();
    
    if (error || !session) {
      document.getElementById('initializingBox').innerHTML = `
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.2rem; color: #ef4444; margin-bottom: 12px;"></i>
        <h4 style="margin-bottom: 6px;">Invalid Reset Link</h4>
        <p style="font-size: 0.82rem; color: var(--text-glass-muted); line-height: 1.4;">The recovery link is invalid, expired, or has already been used. Please request a new link from the login page.</p>
        <button class="btn-primary" style="margin-top: 20px; height: 44px; font-size: 0.88rem;" onclick="window.location.href='login.html'">Back to Login</button>
      `;
      return;
    }

    // Session is valid, display form
    document.getElementById('initializingBox').style.display = 'none';
    document.getElementById('resetForm').style.display = 'block';
  } catch (err) {
    showError("An unexpected error occurred. Please try again.");
    console.error(err);
  }
}

document.getElementById('resetForm').addEventListener('submit', async function(e){
  e.preventDefault();
  hideError();
  
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  
  if(!password || !confirmPassword){
    showError("Please fill in all fields.");
    return;
  }
  if(password.length < 6){
    showError("Password must be at least 6 characters long.");
    return;
  }
  if(password !== confirmPassword){
    showError("Passwords do not match.");
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Updating…';

  try {
    const { error } = await db.auth.updateUser({ password: password });
    if(error) throw error;

    showSuccess("✅ Password updated successfully! Redirecting to login...");
    document.getElementById('resetForm').style.display = 'none';
    
    // Clear custom activity session data
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('renance_remember');
    localStorage.removeItem('renance_last_activity');
    
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 3000);
  } catch (err) {
    showError("❌ " + (err.message || "Failed to update password. Please try again."));
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Update Password';
  }
});

window.onload = verifySession;
</script>
</body>
</html>
