<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010510"/>
      <stop offset="40%" stop-color="#020b20"/>
      <stop offset="100%" stop-color="#030d18"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2a5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a2a5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3d6b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a3d6b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a6aff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a2a6e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f9eff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glow12">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glow30">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="blur50" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="blur25" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="blur10" x="-40%" y="-40%" width="180%" height="180%">
