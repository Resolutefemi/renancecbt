<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENANCE — Create Account</title>
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb;--blue-dark:#1d4ed8;--blue-hover:#1e40af;
  --blue-shadow:rgba(37,99,235,0.35);
  --glass-bg: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.22);
  --glass-input: rgba(255,255,255,0.14);
  --glass-input-focus: rgba(255,255,255,0.22);
  --text-glass: #ffffff;
  --text-glass-muted: rgba(255,255,255,0.75);
}
html{height:100%}
body{min-height:100%;font-family:'Inter',sans-serif;color:#fff;overflow-x:hidden}

/* —— BACKGROUND â€” single crisp bg.svg, no blur ——————— */
.bg-static{
  position:fixed;inset:0;z-index:0;
  background-image:url('bg.svg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* Dark gradient overlay */
.page-overlay{
  position:fixed;inset:0;z-index:1;
  background:linear-gradient(135deg,
    rgba(3,7,30,0.72) 0%,
    rgba(15,23,55,0.60) 50%,
    rgba(3,7,30,0.78) 100%);
}

/* Subtle scan-line texture */
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px)}

/* —— LAYOUT ——————————————————————————————————————————— */
.layout{
  position:relative;z-index:10;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:24px 16px;
}

/* —— GLASS CARD ——————————————————————————————————————— */
.card{
  width:100%;max-width:420px;
  background: var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:22px;
  padding:32px 28px 28px;
  box-shadow:
    0 24px 64px rgba(0,0,0,0.40),
    0 0 0 1px rgba(255,255,255,0.06),
    inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  animation:cardIn 0.6s cubic-bezier(.16,1,.3,1) both;
  overflow:hidden;
}
@keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}

/* —— HEADER ——————————————————————————————————————————— */
.card-header{text-align:center;margin-bottom:20px}
.gem-wrap{
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;
  background:linear-gradient(135deg,rgba(37,99,235,0.85),rgba(124,58,237,0.85));
  border-radius:16px;margin-bottom:10px;
  box-shadow:0 8px 32px rgba(37,99,235,0.5),inset 0 1px 0 rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.2);
}
.futa-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);
  border-radius:100px;padding:4px 12px;font-size:0.68rem;font-weight:700;
  letter-spacing:1px;color:rgba(255,255,255,0.85);text-transform:uppercase;
  margin-bottom:10px;
}
.card-header h1{font-size:1.55rem;font-weight:800;color:#fff;letter-spacing:-0.5px;margin-bottom:4px}
.card-header p{font-size:0.82rem;color:var(--text-glass-muted)}

/* —— STEP INDICATOR ———————————————————————————————————— */
.step-indicator { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
.step-dot { width: 30px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; transition: background 0.4s; }
.step-dot.active { background: #60a5fa; box-shadow: 0 0 8px rgba(96,165,250,0.5); }

/* —— FORM SLIDING TRACK ————————————————————————————————— */
.form-window { overflow: hidden; width: 100%; position: relative; }
.form-track { display: flex; width: 200%; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.step-pane { width: 50%; padding: 0 4px; flex-shrink: 0; }

/* —— FIELDS ———————————————————————————————————————————— */
.field{margin-bottom:16px}
.field label{display:block;font-size:0.86rem;font-weight:600;color:rgba(255,255,255,0.9);margin-bottom:8px}
.field-wrap{position:relative;display:flex;align-items:center}
.field-icon{position:absolute;left:14px;color:rgba(255,255,255,0.45);pointer-events:none;font-size:0.95rem;transition:color 0.2s}
.field:focus-within .field-icon{color:rgba(255,255,255,0.9)}
.field input{
  width:100%;height:46px;
  background: var(--glass-input);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;
  padding:0 12px 0 40px;
  font-size:0.9rem;font-family:'Inter',sans-serif;color:#fff;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  -webkit-appearance:none;
}
.field input::placeholder{color:rgba(255,255,255,0.35)}
.field input:focus{
  background: var(--glass-input-focus);
  border-color:rgba(255,255,255,0.45);
  box-shadow:0 0 0 3px rgba(255,255,255,0.08);
}
.field input:-webkit-autofill,
.field input:-webkit-autofill:focus{
  -webkit-box-shadow: 0 0 0 1000px rgba(30,50,100,0.7) inset !important;
  -webkit-text-fill-color: #fff !important;
  border-color:rgba(255,255,255,0.25) !important;
}

.pw-toggle{position:absolute;right:14px;color:rgba(255,255,255,0.45);cursor:pointer;padding:8px;transition:color .2s;z-index:2}
.pw-toggle:hover{color:#fff}

/* —— PHONE NUMBER STYLING —————————————————————————————— */
.pr{display:flex;gap:10px}
.cw{flex-shrink:0;position:relative}
.cw select{
  width:95px;height:46px;
  background: var(--glass-input);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;
  color:#fff;font-family:'Inter',sans-serif;font-size:0.9rem;
  outline:none;cursor:pointer;
  -webkit-appearance:none;
  padding:0 10px;
  text-align:center;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
}
.cw select:focus{
  background: var(--glass-input-focus);
  border-color:rgba(255,255,255,0.45);
  box-shadow:0 0 0 3px rgba(255,255,255,0.08);
}
.cw select option{
  background:#111827;
  color:#fff;
}

/* —— SELECT / DROPDOWNS ————————————————————————————————— */
.sw{position:relative;display:flex;align-items:center}
.sw select{
  width:100%;height:46px;
  background: var(--glass-input);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;
  padding:0 40px 0 40px;
  font-size:0.9rem;font-family:'Inter',sans-serif;color:#fff;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  -webkit-appearance:none;
  cursor:pointer;
}
.sw::after{
  content:'\f107';font-family:'Font Awesome 6 Free';font-weight:900;
  position:absolute;right:16px;color:rgba(255,255,255,0.45);
  font-size:0.85rem;pointer-events:none;
}
.sw select:focus{
  background: var(--glass-input-focus);
  border-color:rgba(255,255,255,0.45);
  box-shadow:0 0 0 3px rgba(255,255,255,0.08);
}
.sw select option{
  background:#111827;
  color:#fff;
}
.sw:focus-within .field-icon{color:rgba(255,255,255,0.9)}

/* —— STRENGTH INDICATOR ———————————————————————————————— */
.str{display:flex;gap:4px;margin-top:8px}
.sg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);transition:background 0.4s,box-shadow 0.4s}

/* —— ERRORS ———————————————————————————————————————————— */
.err{font-size:0.8rem;color:#fca5a5;margin-top:6px;display:none;}

/* —— BUTTONS ——————————————————————————————————————————— */
.btn-row { display: flex; gap: 10px; margin-top: 24px; z-index: 10; position: relative; }
.btn-primary{
  flex:1;height:46px;border:none;border-radius:12px;
  background:linear-gradient(135deg,rgba(29,78,216,0.9),rgba(37,99,235,0.9));
  color:#fff;font-family:'Inter',sans-serif;font-size:0.97rem;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 24px rgba(37,99,235,0.45),inset 0 1px 0 rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.15);
  transition:transform .15s,box-shadow .2s,background .2s;
}
.btn-primary:hover{
  background:linear-gradient(135deg,rgba(30,64,175,0.95),rgba(29,78,216,0.95));
  box-shadow:0 10px 32px rgba(37,99,235,.55);transform:translateY(-1px)
}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}

.btn-secondary{
  width:46px;height:46px;border:none;border-radius:12px;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);
  color:#fff;font-family:'Inter',sans-serif;font-size:1rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,background .2s;
}
.btn-secondary:hover{
  background:rgba(255,255,255,0.18);
}
.btn-secondary:active{transform:scale(0.97)}

/* —— FOOTER LINK ——————————————————————————————————————— */
.lr{text-align:center;margin-top:24px;font-size:0.88rem;color:var(--text-glass-muted)}
.lr a{color:#93c5fd;font-weight:700;text-decoration:none;transition:color .2s}
.lr a:hover{color:#fff}

.card-divider{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);text-align:center}
.card-divider p{font-size:0.72rem;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;text-transform:uppercase}

/* —— TOAST ————————————————————————————————————————————— */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(17,24,39,0.96);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);border-radius:100px;
  padding:12px 26px;font-size:0.82rem;font-weight:600;color:#f9fafb;
  opacity:0;transition:opacity .3s,transform .3s;z-index:9999;
  white-space:nowrap;box-shadow:0 10px 40px rgba(0,0,0,.4)
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(16,185,129,.4);color:#34d399}
#toast.bad{border-color:rgba(239,68,68,.4);color:#f87171}

/* —— RESPONSIVE ——————————————————————————————————————— */
@media(max-width:600px){
  .layout{padding:12px 10px;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{padding:24px 18px 22px;border-radius:18px;max-width:100%}
  .card-header{margin-bottom:16px}
  .card-header h1{font-size:1.35rem}
  .card-header p{font-size:0.76rem}
  .gem-wrap{width:48px;height:48px;border-radius:14px}
  .step-indicator{margin-bottom:14px}
  .step-dot{width:24px;height:3px}
  .field{margin-bottom:14px}
  .field label{font-size:0.78rem;margin-bottom:6px}
  .field input{height:42px;font-size:16px!important;border-radius:10px;padding-left:36px}
  .field-icon{left:12px;font-size:0.85rem}
  .cw select{width:85px;height:42px;font-size:0.85rem;border-radius:10px}
  .sw select{height:42px;font-size:16px!important;border-radius:10px;padding-left:36px;padding-right:36px}
  .btn-primary{height:44px;font-size:0.88rem;border-radius:10px}
  .btn-secondary{width:44px;height:44px;border-radius:10px}
  .btn-row{margin-top:18px;gap:8px}
  .lr{font-size:0.82rem;margin-top:18px}
}
@media(max-width:380px){
  .card{padding:20px 14px 18px;border-radius:16px}
  .card-header h1{font-size:1.2rem}
  .field input{height:40px}
  .cw select{width:78px;height:40px}
  .sw select{height:40px}
  .btn-primary{height:42px}
  .btn-secondary{width:42px;height:42px}
}
</style>
</head>
<body>

<!-- Single crisp background -->
<div class="bg-static"></div>
<div class="page-overlay"></div>
<div class="scan"></div>
<div id="toast"></div>

<div class="layout">
  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <div class="gem-wrap">
        <i class="fa-solid fa-graduation-cap" style="font-size:1.7rem;color:#fff"></i>
      </div>
      <div class="futa-badge">
        <i class="fa-solid fa-location-dot" style="font-size:0.6rem"></i>
        Federal University of Tech, Akure
      </div>
      <h1>Create Account</h1>
      <p>Join the FUTA CBT simulation platform</p>
    </div>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>

    <form id="sf" novalidate>
      <div class="form-window">
        <div class="form-track" id="formTrack">
          
          <div class="step-pane">
            <div class="field">
              <label>Full Name</label>
              <div class="field-wrap">
                <i class="fa-solid fa-user field-icon"></i>
                <input type="text" id="fullname" placeholder="Osarekpame Williams" required>
              </div>
              <div class="err" id="e-name">Enter your full name</div>
            </div>

            <div class="field">
              <label>Email Address</label>
              <div class="field-wrap">
                <i class="fa-solid fa-envelope field-icon"></i>
                <input type="email" id="email" placeholder="student@gmail.com" required>
              </div>
              <div class="err" id="e-email">Enter a valid email</div>
            </div>

            <div class="field">
              <label>Password</label>
              <div class="field-wrap">
                <i class="fa-solid fa-lock field-icon"></i>
                <input type="password" id="password" placeholder="Min 8 characters" required>
                <i class="fa-solid fa-eye pw-toggle" id="togPw"></i>
              </div>
              <div class="str"><div class="sg" id="s1"></div><div class="sg" id="s2"></div><div class="sg" id="s3"></div><div class="sg" id="s4"></div></div>
              <div class="err" id="e-pw">Minimum 8 characters</div>
            </div>

            <div class="btn-row">
              <button type="button" class="btn-primary" id="nextBtn">
                <span class="btxt">NEXT STEP <i class="fa-solid fa-arrow-right"></i></span>
              </button>
            </div>
          </div>

          <div class="step-pane">
            <div class="field">
              <label>Phone Number</label>
              <div class="pr">
                <div class="cw">
                  <select id="code" tabindex="-1">
                    <option value="+234">+234 🇳🇬</option>
                  </select>
                </div>
                <div class="field-wrap" style="flex:1">
                  <i class="fa-solid fa-mobile-screen-button field-icon" style="left:14px"></i>
                  <input type="tel" id="phone" placeholder="08012345678" style="padding-left:44px">
                </div>
              </div>
              <div class="err" id="e-phone">Enter a valid number</div>
            </div>

            <div class="field">
              <label>Faculty / School</label>
              <div class="sw">
                <i class="fa-solid fa-school field-icon"></i>
                <select id="faculty" required>
                  <option value="" disabled selected>Select your faculty</option>
                  <option value="SOC">School of Computing (SOC)</option>
                  <option value="SLIT">School of Logistics & Innovation Tech</option>
                  <option value="SPS">School of Physical Sciences</option>
                  <option value="SESE">School of Electrical Systems Eng</option>
                  <option value="SIMME">School of Infrastructure & Mfg</option>
                  <option value="SET">School of Environmental Tech</option>
                  <option value="SAAT">School of Agric & Agric Tech</option>
                  <option value="SEMS">School of Earth & Mineral Sci</option>
                  <option value="SLS">School of Life Sciences</option>
                  <option value="CHS">College of Health Sciences</option>
                  <option value="GNS">General Studies</option>
                </select>
              </div>
              <div class="err" id="e-fac">Select your faculty</div>
            </div>

            <div class="field">
              <label>Department</label>
              <div class="sw">
                <i class="fa-solid fa-book-open field-icon"></i>
                <select id="dept" required>
                  <option value="" disabled selected>Select faculty first</option>
                </select>
              </div>
              <div class="err" id="e-dept">Select your department</div>
            </div>

            <div class="btn-row">
              <button type="button" class="btn-secondary" id="backBtn">
                <span class="btxt"><i class="fa-solid fa-arrow-left"></i></span>
              </button>
              <button type="submit" class="btn-primary" id="subBtn">
                <span class="btxt"><i class="fa-solid fa-user-plus"></i> REGISTER</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    </form>

    <div class="lr">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>

    <div class="card-divider">
      <p>Federal University of Technology, Akure</p>
    </div>

  </div>
</div>

function toast(m, t=''){
  const el = document.getElementById('toast');
  el.textContent = m;
  el.className = 'show ' + t;
  clearTimeout(el._);
  el._ = setTimeout(() => el.className = '', 4000);
}

const track = document.getElementById('formTrack');
const dot1 = document.getElementById('dot1');

function se(id,show){
  const el=document.getElementById('e-'+id);

}

  let ok = true;
  const fn = document.getElementById('fullname').value.trim();

    dot2.classList.add('active');

};

document.getElementById('faculty').addEventListener('change',function(){
  const s = document.getElementById('dept');
  s.innerHTML = '<option value="" disabled selected>Select department</option>';
  const selectedFaculty = this.value;
  
  if (depts[selectedFaculty]) {
    depts[selectedFaculty].forEach(d => {
      const o = document.createElement('option');
      o.value = d;
      o.textContent = d;
      s.appendChild(o);
    });
  }
  se('fac', false);
});

document.getElementById('sf').addEventListener('submit', async function(e){
  e.preventDefault();
  let ok = true;
  
  const fn = document.getElementById('fullname').value.trim();
  const em = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const cd = document.getElementById('code').value;
  const phNum = document.getElementById('phone').value.trim();
  const ph = cd + phNum;
  const fa = document.getElementById('faculty').value;
  const de = document.getElementById('dept').value;
  
  if(phNum.length < 7){se('phone',1);ok=false} else {se('phone',0)}
  if(!fa){se('fac',1);ok=false} else {se('fac',0)}
  if(!de){se('dept',1);ok=false} else {se('dept',0)}

  if(ok) {
    const btn = document.getElementById('subBtn');
    const btxt = btn.querySelector('.btxt');
    
    btn.disabled = true;
    btxt.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> CREATING...';
    
    try {
      const { data: authData, error: authError } = await db.auth.signUp({
        email: em,
        password: pw
      });
      if (authError) throw authError;
      
      const uid = authData.user?.id;
      if (uid) {
        const { error: dbError } = await db.from('students').insert([{
          id: uid, fullname: fn, email: em, faculty: fa, department: de, phone: ph
        }]);
        if (dbError) throw dbError;
      }
      
      btxt.innerHTML = '<i class="fa-solid fa-check"></i> SUCCESS';
      btn.style.background = '#10b981';
      btn.style.boxShadow = '0 0 30px rgba(16,185,129,0.5)';
      
      toast('🎉 Account created! Redirecting to login...', 'ok');
      setTimeout(() => window.location.href = 'login.html', 2000);
      
    } catch (err) {
      console.error(err);
      toast('❌ ' + (err.message || 'Something went wrong. Please try again.'), 'bad');
      btn.disabled = false;
      btxt.innerHTML = '<i class="fa-solid fa-user-plus"></i> REGISTER';
    }
  }
});

document.getElementById('togPw').addEventListener('click',function(e){
  e.preventDefault(); 
  const p=document.getElementById('password'),t=p.type==='text';
  p.type=t?'password':'text';
  this.classList.toggle('fa-eye',t); this.classList.toggle('fa-eye-slash',!t);
});

document.getElementById('password').addEventListener('input',function(){
  const v=this.value;let s=0;
  if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const c=['#ef4444','#f59e0b','#10b981','#3b82f6'],g=['rgba(239,68,68,.4)','rgba(245,158,11,.4)','rgba(16,185,129,.4)','rgba(59,130,246,.4)'];
  [1,2,3,4].forEach(i=>{
    const sg=document.getElementById('s'+i);
    if(i<=s){sg.style.background=c[s-1];sg.style.boxShadow=`0 0 6px ${g[s-1]}`}
    else{sg.style.background='rgba(255,255,255,.05)';sg.style.boxShadow='none'}
  });
});
</script>
</body>
</html>
