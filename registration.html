    <script>
        const SUPABASE_URL = window.env?.SUPABASE_URL || 'https://ubxsywaxdvkhiqepcvmq.supabase.co';
        const SUPABASE_KEY = window.env?.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieHN5d2F4ZHZraGlxZXBjdm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5ODcwMDAsImV4cCI6MjA4NzU2MzAwMH0.gkR3Aud3LRLNyNwpDHJTT0vIrWCnQkSBkFSaFjQ5qy4';
        if (!window._sb) window._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const db = window._sb;

        function toggleNav() { document.getElementById('sidebar').classList.toggle('open'); }
        
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadData() {
            const name = localStorage.getItem('studentName') || "FUTA Student";
            const dept = localStorage.getItem('studentDept') || "Department";
            const matric = localStorage.getItem('studentMatric') || "CSC/25/0000";

            // Update UI
            document.getElementById('val_name').innerText = name;
            document.getElementById('val_dept').innerText = dept;
            document.getElementById('val_matric').innerText = matric;
            document.getElementById('p_top_name').innerText = name;
            document.getElementById('p_top_matric').innerText = "Matric: " + matric;
            document.getElementById('navUserName').innerText = name.split(' ')[0];

            // Initials
            const initials = name.trim().split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            document.getElementById('p_initials').innerText = initials || "??";
            document.getElementById('navInitials').innerText = initials || "??";
        }

        async function syncFromDatabase() {
            try {
                const { data: { user }, error: authErr } = await db.auth.getUser();
                if (authErr || !user) return;
                const { data: student } = await db.from('students').select('*').eq('id', user.id).single();
                if (student) {
                    localStorage.setItem('studentName', student.fullname || '');
                    localStorage.setItem('studentDept', student.department || '');
                    localStorage.setItem('studentMatric', student.matric || '');
                    loadData();
                }
            } catch (e) { console.error('Database load failed:', e); }
        }

        function toggleEdit() {
            document.querySelectorAll('.info-value').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.edit-input').forEach(i => i.style.display = 'block');
            
            document.getElementById('input_name').value = document.getElementById('val_name').innerText;
            document.getElementById('input_dept').value = document.getElementById('val_dept').innerText;
            document.getElementById('input_matric').value = document.getElementById('val_matric').innerText;

            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'flex';
        }

        async function saveProfile() {
            const newName = document.getElementById('input_name').value.trim();
            const newDept = document.getElementById('input_dept').value.trim();
            const newMatric = document.getElementById('input_matric').value.trim();

            // Simple Validation
            if(newName.length < 3) return alert("Please enter a valid name");

            // Save to LocalStorage using the dashboard-compatible keys
            localStorage.setItem('studentName', newName);
            localStorage.setItem('studentDept', newDept);
            localStorage.setItem('studentMatric', newMatric.toUpperCase());

            // Exit edit mode
            document.querySelectorAll('.info-value').forEach(s => s.style.display = 'block');
            document.querySelectorAll('.edit-input').forEach(i => i.style.display = 'none');
            document.getElementById('editBtn').style.display = 'flex';
            document.getElementById('saveBtn').style.display = 'none';

            loadData(); 

            // Sync to Supabase
            try {
                const { data: { user } } = await db.auth.getUser();
                if (user) {
                    const { error } = await db.from('students').update({
                        fullname: newName,
                        department: newDept,
                        matric: newMatric.toUpperCase()
                    }).eq('id', user.id);
                    if (error) throw error;
                    alert("Profile Synced Successfully! 🎉");
                } else {
                    alert("Profile saved locally.");
                }
            } catch (e) {
                console.error('Database sync failed:', e);
                alert("Profile saved locally, but database sync failed.");
            }
        }

        function logout() {
            db.auth.signOut().then(() => {
                localStorage.clear();
                window.location.href = 'login.html';
            });
        }

        window.onload = () => {
            loadData();
            syncFromDatabase();
            if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            lucide.createIcons();
        };
    </script>
